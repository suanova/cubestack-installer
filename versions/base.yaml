# K8s binaries bundle (kubelet/kubeadm/kubectl/crictl/CNI/containerd/runc/etcd).
# The source pins where/which version; release runs the installer's
# build-k8s-binaries.sh at packaging time and does not depend on a GitHub
# Release asset. release fills source.repo/ref from the pinned baseline commit.
files:
  - key: k8s:binaries
    path: offline-files/kubespray/v2.32.0/binaries.tar.gz
    source:
      type: installer-binaries
      version: v2.32.0
      arch: amd64
    extract: true
    mode: '0644'
