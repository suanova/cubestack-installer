    arm64: sha256:9235f55386cfd96e2f55393e997efec7768049cf2379a8dffa07e724890a4691
  calico_crds:
    no_arch: sha256:3f62456ede5360c773e007011992c0081b8b6c442f7c9ce66a9f51a2f5d9dbcd
# Vendor artifacts that cannot be fetched from a public registry. Each entry is
# an index item: the open-source flow points users at the vendor portal, and the
# commercial packaging overlay supplies a local source for the same key.
materials:
- key: metax:gpu-k8s-package
  module: gpu_operator
  version: ${METAX_VERSION}
  file: metax-gpu-k8s-package.${METAX_VERSION}.tar.gz
  dest: offline-files/metax-gpu
  optional: true
  source:
    type: vendor-portal
    provider: metax
    portal: https://metax-tech.com
    account_required: true
- key: metax:k8s-images
  module: gpu_operator
  version: ${METAX_VERSION}
  file: metax-k8s-images.${METAX_VERSION}.run
  dest: offline-files/metax-gpu
  optional: true
  source:
    type: vendor-portal
    provider: metax
    portal: https://metax-tech.com
    account_required: true
- key: metax:k8s-driver-image
  module: gpu_operator
  version: ${METAX_DRIVER_VERSION}
  file: metax-k8s-driver-image.${METAX_DRIVER_VERSION}.run
  dest: offline-files/metax-gpu
  optional: true
  source:
    type: vendor-portal
    provider: metax
    portal: https://metax-tech.com
    account_required: true
