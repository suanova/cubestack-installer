# Checksums for managed binary artifacts. CubeStack deploys amd64.
checksums:
  etcd:
    amd64: sha256:c8c0d96d8292ef085deabbf735e9561d3d396768e4d606df005aa25964f21911
    arm64: sha256:ad756ff27ba21e3488cfb84d00f3f4ad8d9b60a93e20f5be5b230a4aab1dc053
