# =====================================================================
# CubeStackInstaller GitLab CI/CD 流水线
#
# 触发方式:代码提交/推送至仓库后自动执行
# 流水线内容:
#   阶段 test  - 后端单元测试(pytest)、前端生产构建校验(npm run build)
#   阶段 build - 构建单镜像并推送至 Harbor 私有仓库(仅 main 分支与标签)
#
# 前置配置(GitLab -> 项目 -> Settings -> CI/CD -> Variables,勾选 Masked):
#   HARBOR_USERNAME  Harbor 登录用户名
#   HARBOR_PASSWORD  Harbor 登录密码或访问令牌
# =====================================================================

stages:
  - test
  - build

variables:
  # 镜像目标仓库(可在项目 CI/CD 变量中覆盖)
  IMAGE_NAME: harbor.isuanova.com/cubestack/cubestack-installer

# ---------------- Stage 1:测试与编译校验 ----------------

# 后端单元测试
backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    # 安装 uv(清华镜像)
    - pip install -q uv -i https://pypi.tuna.tsinghua.edu.cn/simple
  script:
    - cd installer
    - uv sync --frozen
    - uv run pytest -q
  cache:
    key: backend-uv
    paths:
      - installer/.venv
    policy: pull-push

# 前端生产构建校验(编译通过即视为校验成功)
frontend-build:
  stage: test
  image: node:20-alpine
  script:
    - cd ui
    - npm ci --no-fund --no-audit
    - npm run build
  cache:
    key: frontend-npm
    paths:
      - ui/node_modules
    policy: pull-push

# ---------------- Stage 2:镜像构建并推送 Harbor ----------------

build-image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-latest}"
    - echo "登录 Harbor 私有仓库"
    - docker login -u "${HARBOR_USERNAME}" -p "${HARBOR_PASSWORD}" harbor.isuanova.com
    - echo "构建镜像 ${IMAGE_NAME}:${IMAGE_TAG}"
    - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .
    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
  rules:
    # 仅在 main 分支或标签提交时构建并推送镜像
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

