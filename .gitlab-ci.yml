# =====================================================================
# CubeStackInstaller GitLab CI/CD 流水线
#
# 触发方式:代码提交/推送至仓库后自动执行
# 流水线内容:
#   backend-test    后端单元测试(pytest,依赖管理采用 uv)
#   frontend-build  前端生产构建校验(npm run build)
# =====================================================================

stages:
  - test

# 后端单元测试
backend-test:
  stage: test
  image: python:3.12-slim
  before_script:
    # 安装 uv(清华镜像)
    - pip install -q uv -i https://pypi.tuna.tsinghua.edu.cn/simple
  script:
    - cd installer
    - uv sync --frozen
    - uv run pytest -q
  cache:
    key: backend-uv
    paths:
      - installer/.venv
    policy: pull-push

# 前端生产构建校验(编译通过即视为校验成功)
frontend-build:
  stage: test
  image: node:20-alpine
  script:
    - cd ui
    - npm ci --no-fund --no-audit
    - npm run build
  cache:
    key: frontend-npm
    paths:
      - ui/node_modules
    policy: pull-push

