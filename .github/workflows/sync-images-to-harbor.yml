name: Sync images to Harbor mirror

# ============================================================================
# 把 CubeStack 部署所需的**全部上游原始镜像**同步到 Harbor 统一镜像源。
#
#   deployments/config/images.manifest  ──(本工作流)──▶  harbor.isuanova.com/mirrors/**
#
# 之后部署机只需能连 Harbor(不再需要 docker.io / quay.io / registry.k8s.io / ghcr.io),
# 用 tools/images/harbor-save-images.sh 拉成离线 tar, 再由部署模块推入集群内置 registry。
# 详见 docs/harbor-mirror.md。
#
# ── 凭据(加密存储) ────────────────────────────────────────────────────────
#   在仓库 Settings → Secrets and variables → Actions 配置:
#     HARBOR_MIRROR_USER      Harbor 用户名(如 clquan)      —— 也可放 Variables
#     HARBOR_MIRROR_PASSWORD  Harbor 密码/token             —— **必须放 Secrets**(加密)
#   本工作流只以环境变量形式传给脚本; 脚本再写进 600 权限的临时 auth 文件,
#   凭据不进 argv、不进日志、不落仓库。
#
# ── 触发 ────────────────────────────────────────────────────────────────
#   · push 到 main 且改动镜像清单/版本/同步工具 → 自动增量同步
#   · 手动触发 → 可指定分组 / 强制重同步 / 单架构
#   · 每周一凌晨定时 → 兜底刷新(捕获 :latest 等浮动 tag 的上游更新)
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      groups:
        description: '只同步指定分组(逗号分隔; 留空=全部。如 prometheus,envoy)'
        required: false
        default: ''
      exclude_groups:
        description: '排除分组(如 metax-gpu — 体积大)'
        required: false
        default: ''
      force:
        description: '强制重新同步(忽略 digest 相同)'
        type: boolean
        required: false
        default: false
      platform:
        description: '架构模式: all(保留多架构 manifest list) 或 amd64(单架构)'
        required: false
        default: 'all'
      dry_run:
        description: '只演练不推送'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'deployments/config/images.manifest'
      - 'deployments/config/cluster.conf.example'
      - 'deployments/scripts/tools/images/**'
      - '.github/workflows/sync-images-to-harbor.yml'
  schedule:
    # 每周一 03:23 UTC(避开整点, 减轻上游 registry 与 runner 的整点拥挤)
    - cron: '23 3 * * 1'

permissions:
  contents: read

# 同一时刻只跑一个同步(增量逻辑读的是远端 digest, 并发会互相干扰)
concurrency:
  group: harbor-mirror-sync
  cancel-in-progress: false

env:
  # 用户名允许放 Variables(非敏感); 密码只用 Secrets(加密)
  HARBOR_MIRROR_USER: ${{ secrets.HARBOR_MIRROR_USER || vars.HARBOR_MIRROR_USER }}
  HARBOR_MIRROR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
  HARBOR_MIRROR_REGISTRY: harbor.isuanova.com
  HARBOR_MIRROR_PROJECT: mirrors

jobs:
  # ── ① 静态校验: 清单本身错了就不必浪费带宽去同步 ──
  validate:
    name: Validate image manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest (offline)
        run: |
          set -euo pipefail
          bash deployments/scripts/tools/images/check-image-manifest.sh --kubespray
          echo "✅ 清单静态校验通过" >> "$GITHUB_STEP_SUMMARY"

  # ── ② 同步: 上游 → Harbor ──
  sync:
    name: Sync upstream images → Harbor
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check credentials are configured
        run: |
          set -euo pipefail
          missing=""
          [ -n "${HARBOR_MIRROR_USER:-}" ]     || missing="${missing} HARBOR_MIRROR_USER"
          [ -n "${HARBOR_MIRROR_PASSWORD:-}" ] || missing="${missing} HARBOR_MIRROR_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::缺少凭据 secret/variable:${missing}。请在仓库 Settings → Secrets and variables → Actions 配置后重试。"
            exit 1
          fi
          echo "凭据已配置(用户名: ${HARBOR_MIRROR_USER}; 密码长度: ${#HARBOR_MIRROR_PASSWORD})"

      - name: Log in to Harbor
        # 参考 suanova/cuberouter 的 release.yml: 提前登录, 凭据错误在这里就明确失败
        # (真正的镜像搬运走 skopeo, 不依赖 docker 登录态)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_MIRROR_REGISTRY }}
          username: ${{ env.HARBOR_MIRROR_USER }}
          password: ${{ env.HARBOR_MIRROR_PASSWORD }}

      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          skopeo --version

      - name: Show sync plan
        run: |
          set -euo pipefail
          {
            echo "### 待同步镜像清单"
            echo '```'
            bash deployments/scripts/tools/images/harbor-sync-images.sh --list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sync images to Harbor
        run: |
          set -euo pipefail
          args=()
          [ -n "${{ inputs.groups }}" ]         && args+=( --group "${{ inputs.groups }}" )
          [ -n "${{ inputs.exclude_groups }}" ] && args+=( --exclude-group "${{ inputs.exclude_groups }}" )
          [ "${{ inputs.force }}" = "true" ]    && args+=( --force )
          [ "${{ inputs.dry_run }}" = "true" ]  && args+=( --dry-run )
          case "${{ inputs.platform }}" in
            ''|all) platform=all ;;
            *)      platform="${{ inputs.platform }}" ;;
          esac
          args+=( --platform "${platform}" )

          echo "执行: harbor-sync-images.sh ${args[*]}"
          bash deployments/scripts/tools/images/harbor-sync-images.sh "${args[@]}"

      - name: Verify (Harbor drift should be zero)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          echo "### 同步后 Harbor 漂移检查" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            bash deployments/scripts/tools/images/check-image-manifest.sh --harbor
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── ③ 定时触发的浮动 tag 提示 ──
  # :latest / 0.1.0-latest 这类 tag 会随上游漂移, digest 比对能捕获并重传, 这里只在
  # 摘要里点出来, 免得"看起来没变"却被忽略。
  note-floating-tags:
    name: Note floating tags
    runs-on: ubuntu-latest
    needs: sync
    if: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          echo "### 定时同步完成" >> "$GITHUB_STEP_SUMMARY"
          echo "浮动 tag(每次都按 digest 重新校验):" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E ':(latest|[0-9.]+-latest)$' deployments/config/images.manifest \
            | grep -v '^\s*#' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
