name: Refresh operator chart in MinIO

# ============================================================================
# cubestack-operator 的 helm chart 变化后, 把最新 chart 上传到 MinIO 离线包。
#
# 为什么不再重建 CLI 镜像: chart 已改为随离线包分发
#   (offline-files/cubestack-operator/charts/), CLI 镜像不再包含它。
#   chart 与组件镜像 tar 同目录, 部署机用 fetch-offline-from-minio.sh 一起取回。
#
# 触发:
#   repository_dispatch: event_type=operator-chart-updated (来自 cubestack-operator)
#   workflow_dispatch:    手动补发 / 首次 seed
#
# 一次性配置 (repo Settings):
#   Org secrets: MINIO_HOSTNAME, MINIO_USERNAME, MINIO_PASSWORD
#   Repo Secrets: HARBOR_MIRROR_PASSWORD
#   Repo Vars:    HARBOR_MIRROR_USER, HARBOR_MIRROR_REGISTRY, HARBOR_MIRROR_INSECURE,
#                 MINIO_BUCKET, MINIO_REMOTE_DIR, MINIO_INSECURE
# ============================================================================

on:
  repository_dispatch:
    types: [operator-chart-updated]
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'operator chart version'
        required: false
        default: '1.0.0-latest'
      force:
        description: '即使远端 digest 相同也重新上传'
        type: boolean
        required: false
        default: false
      dry_run:
        description: '只比对/打印, 不上传'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-operator-chart
  cancel-in-progress: false

jobs:
  refresh:
    name: Pull chart from Harbor and upload to MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HARBOR_HOST: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
      HARBOR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
      HARBOR_INSECURE: ${{ vars.HARBOR_MIRROR_INSECURE || 'false' }}
      CHART_REF: oci://${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}/suanova-private/cubestack-operator-chart
      CHART_VERSION: ${{ github.event.client_payload.chart_version || github.event.inputs.chart_version || '1.0.0-latest' }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_HOSTNAME }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_USERNAME }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_PASSWORD }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'cubestack-installer' }}
      MINIO_REMOTE_DIR: ${{ vars.MINIO_REMOTE_DIR || 'offline-files' }}
      MINIO_INSECURE: ${{ vars.MINIO_INSECURE || 'false' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=0
          for v in HARBOR_HOST HARBOR_USER HARBOR_PASSWORD MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing required configuration: ${v}"
              missing=1
            fi
          done
          [ "${missing}" = "0" ] || exit 1
          echo "chart=${CHART_REF} version=${CHART_VERSION}"
          echo "minio=${MINIO_BUCKET}/${MINIO_REMOTE_DIR}/cubestack-operator/charts/"

      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install mc
        run: |
          set -euo pipefail
          curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /tmp/mc
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc
          helm version --short
          mc --version

      - name: Pull operator chart
        run: |
          set -euo pipefail
          chart_dir="${RUNNER_TEMP}/chart"
          rm -rf "${chart_dir}"; mkdir -p "${chart_dir}"

          printf '%s' "${HARBOR_PASSWORD}" \
            | helm registry login "${HARBOR_HOST}" -u "${HARBOR_USER}" --password-stdin

          out="$(helm pull "${CHART_REF}" --version "${CHART_VERSION}" -d "${chart_dir}" 2>&1)" || {
            printf '%s\n' "${out}"
            exit 1
          }
          printf '%s\n' "${out}"

          tgz="$(ls -1t "${chart_dir}"/*.tgz 2>/dev/null | head -1 || true)"
          digest="$(printf '%s\n' "${out}" | sed -n 's/^Digest:[[:space:]]*//p' | head -1)"
          [ -n "${tgz}" ] || { echo "::error::helm pull produced no tgz"; exit 1; }
          [ -n "${digest}" ] || { echo "::error::helm pull reported no Digest"; exit 1; }

          # OCI chart 的 Digest 是 manifest 摘要, 不是 tgz 的 sha256 —— 不要用 sha256sum 重算。
          printf '%s' "${digest}" > "${tgz}.digest"
          echo "CHART_TGZ=${tgz}"         >> "$GITHUB_ENV"
          echo "CHART_DIGEST=${digest}"   >> "$GITHUB_ENV"
          echo "CHART_FILE=$(basename "${tgz}")" >> "$GITHUB_ENV"
          echo "chart=$(basename "${tgz}") digest=${digest}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload to MinIO
        run: |
          set -euo pipefail
          mc_args=()
          [ "${MINIO_INSECURE}" = "true" ] && mc_args+=(--insecure)
          mc "${mc_args[@]}" alias set cubestack-chart "${MINIO_ENDPOINT}" \
            "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" >/dev/null
          mc "${mc_args[@]}" mb --ignore-existing "cubestack-chart/${MINIO_BUCKET}" >/dev/null

          remote="cubestack-chart/${MINIO_BUCKET}/${MINIO_REMOTE_DIR}/cubestack-operator/charts"
          rdig="$(mc "${mc_args[@]}" cat "${remote}/${CHART_FILE}.digest" 2>/dev/null | tr -d '[:space:]' || true)"

          action=upload
          if [ "${FORCE}" != "true" ] && [ "${rdig}" = "${CHART_DIGEST}" ] \
             && mc "${mc_args[@]}" stat "${remote}/${CHART_FILE}" >/dev/null 2>&1; then
            action=skip
          fi

          if [ "${action}" = "skip" ]; then
            echo "chart unchanged (${CHART_DIGEST}), skip upload" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${DRY_RUN}" = "true" ]; then
            echo "would upload ${CHART_FILE} → ${remote}/ (digest ${CHART_DIGEST})" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 先传 tgz, 再传边车: 中断后下次会重做, 不会出现"边车新、文件旧"的假成功。
          mc "${mc_args[@]}" cp "${CHART_TGZ}"          "${remote}/${CHART_FILE}"
          mc "${mc_args[@]}" cp "${CHART_TGZ}.digest"   "${remote}/${CHART_FILE}.digest"

          mc "${mc_args[@]}" stat "${remote}/${CHART_FILE}" >/dev/null
          echo "uploaded ${CHART_FILE} → ${remote}/ (digest ${CHART_DIGEST})" | tee -a "$GITHUB_STEP_SUMMARY"
