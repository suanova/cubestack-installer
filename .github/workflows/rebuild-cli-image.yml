name: Rebuild installer CLI image

# ============================================================================
# 部署代码变更后重建 CLI 镜像：
#   · main        = dev 通道(:latest + MinIO offline-files/cli/);
#   · release-2.0 = 发布通道: 推 release.env 钉死的版本化 CLI 镜像, 并在同一 job
#                   内导出版本化 tar + 更新 MinIO <release>/ 的 CLI 元数据
#                   (release.json/SHA256SUMS/_SUCCESS/_CLI_IMAGE_DIGEST)。
#                   CLI 同步不再依赖 sync-release-images.yml 的 workflow_run。
#
# operator chart 已改为随离线包分发(deployments/offline-files/cubestack-operator/
# 顶层 .tgz, 由内网 cubestack-platform-sync.sh 上传 MinIO), 不再打进 CLI 镜像。
#
# 触发: push 到 main/release-2.0(部署代码/脚本/模板) 或 workflow_dispatch 手动重建
#
# 一次性配置 (repo Settings):
#   Secrets: HARBOR_MIRROR_PASSWORD, MINIO_HOSTNAME, MINIO_USERNAME, MINIO_PASSWORD
#   Vars:    HARBOR_MIRROR_USER, HARBOR_MIRROR_REGISTRY, HARBOR_MIRROR_INSECURE,
#            MINIO_BUCKET, MINIO_REMOTE_DIR, MINIO_INSECURE
# ============================================================================

on:
  # Code-layer inputs baked into the CLI image. offline-files/ and
  # kubespray/versions/ are excluded on purpose (mounted/fetched at runtime).
  push:
    # main = dev 通道(:latest + MinIO offline-files/cli/);
    # release-2.0 = 发布通道(只推 release.env 指定的版本化 CLI 镜像, 不碰 :latest/dev 前缀)。
    branches: [main, release-2.0]
    paths:
      - 'deployments/scripts/**'
      - 'deployments/kubespray/**'
      - '!deployments/kubespray/versions/**'
      - 'deployments/cubestack-addon/**'
      - 'deployments/config/**'
      - 'deployments/releases/**'
      - 'skills/**'
      - 'Dockerfile-cli'
      - 'Dockerfile-cli-base'
      - '.dockerignore'
      - '.github/workflows/rebuild-cli-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '额外推送的 CLI 镜像版本(如 2.0.0; 留空=只推 :latest)'
        required: false
        default: ''

permissions:
  contents: read

# 发布串行化(2026-10-23 CodeRabbit): push 与 workflow_dispatch 共享同一 group,
# 同一时刻只有一个 run 能写 MinIO 的 cli/ 或 <release>/ CLI 元数据;
# cancel-in-progress=false 让后来的 run 排队等待, 而不是取消正在上传的 run
# (否则会留下半套 tar/digest)。
concurrency:
  group: release-minio-writes
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build & push cubestack-installer-cli:latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARBOR_HOST: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
      HARBOR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
      HARBOR_INSECURE: ${{ vars.HARBOR_MIRROR_INSECURE || 'false' }}
      IMAGE_VERSION: ${{ github.event.inputs.version || '' }}
      MINIO_ENDPOINT: ${{ secrets.MINIO_HOSTNAME }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_USERNAME }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_PASSWORD }}
      MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'cubestack-installer' }}
      MINIO_REMOTE_DIR: ${{ vars.MINIO_REMOTE_DIR || 'offline-files' }}
      MINIO_INSECURE: ${{ vars.MINIO_INSECURE || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=0
          for v in HARBOR_HOST HARBOR_USER HARBOR_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing required configuration: ${v}"
              missing=1
            fi
          done
          [ "${missing}" = "0" ] || exit 1

      - name: Resolve target image & channel
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/release-2.0" ]; then
            # release-2.0: 只推 release.env 钉死的版本化 CLI 镜像; 不写 :latest,
            # 也不同步 MinIO offline-files/cli/(那是 dev/latest 通道)。
            rel_env="deployments/releases/2.0.0/release.env"
            [ -f "${rel_env}" ] || { echo "::error::missing ${rel_env}"; exit 1; }
            set -a
            # shellcheck disable=SC1090
            . "${rel_env}"
            set +a
            image="${CUBESTACK_CLI_IMAGE:-}"
            release="${RELEASE_VERSION:-}"
            [ -n "${image}" ] || { echo "::error::${rel_env} 缺少 CUBESTACK_CLI_IMAGE"; exit 1; }
            [ -n "${release}" ] || { echo "::error::${rel_env} 缺少 RELEASE_VERSION"; exit 1; }
            case "${release}" in
              ''|*[!0-9A-Za-z._-]*) echo "::error::invalid RELEASE_VERSION: ${release}"; exit 1 ;;
            esac
            [ -d "deployments/releases/${release}" ] || { echo "::error::missing deployments/releases/${release}"; exit 1; }
            echo "RELEASE=${release}" >> "${GITHUB_ENV}"
            echo "SYNC_DEV_MINIO=false" >> "${GITHUB_ENV}"
          else
            image="${HARBOR_HOST}/suanova/cubestack-installer-cli:latest"
            echo "SYNC_DEV_MINIO=true" >> "${GITHUB_ENV}"
          fi
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "resolved image: ${image}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ env.HARBOR_USER }}
          HARBOR_SECRET: ${{ env.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${HARBOR_SECRET}" | docker login "${HARBOR_HOST}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build CLI image
        run: |
          set -euo pipefail
          bash deployments/scripts/tools/docker/build-cli-context.sh --build --engine docker
          # build-cli-context.sh 固定产出 :latest; release-2.0 分支只额外打版本 tag,
          # 不推送 :latest(避免 release 代码覆盖 dev/latest 通道)。
          built="harbor.isuanova.com/suanova/cubestack-installer-cli:latest"
          if [ "${IMAGE}" != "${built}" ]; then
            docker tag "${built}" "${IMAGE}"
          fi

      - name: Verify required tools are baked into image
        run: |
          set -euo pipefail
          # patch 是 kubespray 补丁层的必需工具; 缺失会让补丁层静默跳过。
          docker run --rm --entrypoint bash "${IMAGE}" -lc \
            'command -v patch >/dev/null && patch --version | head -1'

      - name: Push image
        run: |
          set -euo pipefail
          push_log="${RUNNER_TEMP}/docker-push.log"
          docker push "${IMAGE}" 2>&1 | tee "${push_log}"
          # registry digest 是 Harbor/MinIO 一致性的锚点; docker push 最后一行含
          # "digest: sha256:..."。RepoDigests 作为兼容兜底(部分 Docker 版本)。
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "${push_log}" | tail -1)"
          if [ -z "${digest}" ]; then
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}" \
              | awk -F@ -v ref="${IMAGE}" '$1==ref {print $2; exit}')"
          fi
          [ -n "${digest}" ] || { echo "::error::无法解析 ${IMAGE} 的 registry digest"; exit 1; }
          echo "CLI_IMAGE_DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "pushed ${IMAGE} (${digest})" | tee -a "$GITHUB_STEP_SUMMARY"

      # release-2.0: 手动触发时额外推一个不可变版本 tag(如 :2.0.0), 供 release-publish.sh 生成 CLI tar
      - name: Tag & push versioned CLI image
        if: ${{ github.event.inputs.version != '' }}
        run: |
          set -euo pipefail
          # 经 env 取值: GitHub 会在 shell 解析前展开表达式, 直接把 dispatch 输入拼进
          # 脚本会让 $(...)/反引号在 case 校验前执行(模板注入; CodeRabbit/zizmor)。
          version="${IMAGE_VERSION}"
          case "${version}" in
            ''|*[!0-9A-Za-z._-]*) echo "::error::invalid version: ${version}"; exit 1 ;;
          esac
          target="${HARBOR_HOST}/suanova/cubestack-installer-cli:${version}"
          docker tag "${IMAGE}" "${target}"
          docker push "${target}"
          echo "pushed ${target}" | tee -a "$GITHUB_STEP_SUMMARY"

      # release-2.0: 同一 job 内完成 CLI tar + MinIO 元数据同步。
      # 不再依赖 sync-release-images.yml 的 workflow_run(默认分支监听器可能
      # 缺失/滞后)。同步失败 -> 本 workflow 失败, 且 MinIO 侧 _SUCCESS 不会写,
      # fetch 会明确拒绝半套发布树。
      - name: Sync release CLI tar to MinIO
        if: env.SYNC_DEV_MINIO == 'false'
        run: |
          set -euo pipefail
          [ -n "${RELEASE:-}" ] || { echo "::error::RELEASE 未设置"; exit 1; }
          [ -n "${CLI_IMAGE_DIGEST:-}" ] || { echo "::error::CLI_IMAGE_DIGEST 未设置"; exit 1; }
          curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /tmp/mc
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc
          mc --version

          tar_path="${RUNNER_TEMP}/cubestack-installer-cli-v${RELEASE}.tar"
          docker save "${IMAGE}" -o "${tar_path}"
          bash deployments/scripts/tools/images/release-sync-images.sh \
            --release "${RELEASE}" \
            --component cli \
            --cli-tar "${tar_path}" \
            --cli-image-digest "${CLI_IMAGE_DIGEST}" \
            --summary-file "${RUNNER_TEMP}/sync-summary.md"
          cat "${RUNNER_TEMP}/sync-summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      # main/dev: 把 :latest 导出为离线 tar 同步到 MinIO; 镜像内容未变(按 image ID)则跳过。
      # release-2.0 的版本化 CLI tar 由上方 "Sync release CLI tar to MinIO" 处理。
      - name: Export CLI image & sync tar to MinIO
        if: env.SYNC_DEV_MINIO == 'true'
        run: |
          set -euo pipefail
          if [ -z "${MINIO_ENDPOINT:-}" ] || [ -z "${MINIO_ACCESS_KEY:-}" ] || [ -z "${MINIO_SECRET_KEY:-}" ]; then
            echo "::warning::MINIO_HOSTNAME/MINIO_USERNAME/MINIO_PASSWORD 未配置, 跳过 CLI tar 同步"
            exit 0
          fi
          curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /tmp/mc
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc
          mc --version
          mc_args=()
          if [ "${MINIO_INSECURE}" = "true" ]; then mc_args+=(--insecure); fi
          mc "${mc_args[@]}" alias set cubestack-cli "${MINIO_ENDPOINT}" \
            "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" >/dev/null
          mc "${mc_args[@]}" mb --ignore-existing "cubestack-cli/${MINIO_BUCKET}" >/dev/null

          remote="cubestack-cli/${MINIO_BUCKET}/${MINIO_REMOTE_DIR}/cli"
          image_id="$(docker inspect --format '{{.Id}}' "${IMAGE}")"
          remote_id="$(mc "${mc_args[@]}" cat "${remote}/cubestack-installer-cli.digest" 2>/dev/null \
            | tr -d '[:space:]' || true)"
          if [ "${remote_id}" = "${image_id}" ] \
             && mc "${mc_args[@]}" stat "${remote}/cubestack-installer-cli.tar" >/dev/null 2>&1; then
            echo "CLI image unchanged (${image_id}); skip tar upload" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          tar_path="${RUNNER_TEMP}/cubestack-installer-cli.tar"
          docker save "${IMAGE}" -o "${tar_path}"
          tar_size="$(stat -c %s "${tar_path}")"
          printf '%s' "${image_id}" > "${tar_path}.digest"
          # 发布顺序: tar 先、digest 后 —— digest 是"提交标记", 只在 tar 完整上传后更新。
          # 若 run 在两步之间中断, 远端是"新 tar + 旧 digest", 下次 run 会因 digest 不一致
          # 重新上传两者(自愈), 不会把旧 tar 当成新镜像发布。
          mc "${mc_args[@]}" cp "${tar_path}" "${remote}/cubestack-installer-cli.tar"
          mc "${mc_args[@]}" cp "${tar_path}.digest" "${remote}/cubestack-installer-cli.digest"
          # 发布后校验: 远端 tar 大小 + digest 必须与本次构建的镜像一致, 防止半套/截断产物
          # 被当作成功发布(并发由上方 concurrency group 串行化)。
          remote_id_check="$(mc "${mc_args[@]}" cat "${remote}/cubestack-installer-cli.digest" 2>/dev/null \
            | tr -d '[:space:]' || true)"
          remote_tar_size="$(mc "${mc_args[@]}" stat --json "${remote}/cubestack-installer-cli.tar" 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); d=d[0] if isinstance(d,list) else d; print(d.get("size",""))' 2>/dev/null || true)"
          if [ "${remote_id_check}" != "${image_id}" ] || [ "${remote_tar_size}" != "${tar_size}" ]; then
            echo "::error::CLI 发布校验失败: digest=${remote_id_check:-?}(期望 ${image_id}), tar_size=${remote_tar_size:-?}(期望 ${tar_size})"
            exit 1
          fi
          echo "synced CLI tar → ${remote}/ (image ${image_id}, ${tar_size} bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
