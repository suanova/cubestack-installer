name: Rebuild installer CLI image

# ============================================================================
# 部署代码变更后, 重建 cubestack-installer-cli:latest。
#
# operator chart 已改为随离线包分发(deployments/offline-files/cubestack-operator/
# 顶层 .tgz, 由内网 cubestack-platform-sync.sh 上传 MinIO), 不再打进 CLI 镜像。
#
# 触发: push 到 main(部署代码/脚本/模板) 或 workflow_dispatch 手动重建
#
# 一次性配置 (repo Settings):
#   Secrets: HARBOR_MIRROR_PASSWORD
#   Vars:    HARBOR_MIRROR_USER, HARBOR_MIRROR_REGISTRY, HARBOR_MIRROR_INSECURE
# ============================================================================

on:
  # Code-layer inputs baked into the CLI image. offline-files/ and
  # kubespray/versions/ are excluded on purpose (mounted/fetched at runtime).
  push:
    branches: [main]
    paths:
      - 'deployments/scripts/**'
      - 'deployments/kubespray/**'
      - '!deployments/kubespray/versions/**'
      - 'deployments/cubestack-addon/**'
      - 'deployments/config/**'
      - 'skills/**'
      - 'Dockerfile-cli'
      - '.dockerignore'
      - '.github/workflows/rebuild-cli-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-cli-image
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build & push cubestack-installer-cli:latest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARBOR_HOST: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
      HARBOR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
      HARBOR_INSECURE: ${{ vars.HARBOR_MIRROR_INSECURE || 'false' }}
      IMAGE: harbor.isuanova.com/suanova/cubestack-installer-cli:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=0
          for v in HARBOR_HOST HARBOR_USER HARBOR_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing required configuration: ${v}"
              missing=1
            fi
          done
          [ "${missing}" = "0" ] || exit 1

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ env.HARBOR_USER }}
          HARBOR_SECRET: ${{ env.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${HARBOR_SECRET}" | docker login "${HARBOR_HOST}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build CLI image
        run: |
          set -euo pipefail
          bash deployments/scripts/tools/docker/build-cli-context.sh --build --engine docker

      - name: Push image
        run: |
          set -euo pipefail
          docker push "${IMAGE}"
          echo "pushed ${IMAGE}" | tee -a "$GITHUB_STEP_SUMMARY"
