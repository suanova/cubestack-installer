name: Rebuild installer CLI image

# ============================================================================
# 部署代码变更后重建 CLI 镜像。
#   · push main → :latest(开发通道)
#   · workflow_dispatch + version → 额外推送 :<version>(发布通道; 外部打包流程
#     按 Harbor 中的镜像 digest 取 CLI tar)
#
# operator chart 由外部版本树随包分发, 不再打进 CLI 镜像。
#
# 触发: push 到 main/release-2.1(部署代码/脚本/模板) 或 workflow_dispatch 手动重建
#
# 按改动选择重建哪一层:
#   · images/installer-cli-base/** 变化 → 重建 base + 代码层，并推两个镜像
#   · images/installer-cli/** 或代码输入变化 → 只重建代码层
#   · 代码层永远基于当前 base；base 变了必须连带重建代码层
#
# 一次性配置 (repo Settings):
#   Secrets: HARBOR_MIRROR_PASSWORD
#   Vars:    HARBOR_MIRROR_USER, HARBOR_MIRROR_REGISTRY, HARBOR_MIRROR_INSECURE
# ============================================================================

on:
  # Code-layer inputs baked into the CLI image. offline-files/ and
  # kubespray/versions/ are excluded on purpose (mounted/fetched at runtime).
  push:
    branches: [main, release-2.1]
    paths:
      - 'deployments/scripts/**'
      - 'deployments/kubespray/**'
      - '!deployments/kubespray/versions/**'
      - 'deployments/cubestack-addon/**'
      - 'deployments/config/**'
      - 'versions/**'

      - 'skills/**'
      - 'images/installer-cli/**'
      - 'images/installer-cli-base/**'
      - '.dockerignore'
      - '.github/workflows/rebuild-cli-image.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '推送的 CLI 镜像版本(如 2.1.0; 留空=只推 :latest)'
        required: false
        default: ''
      force_base:
        description: '强制重建 base 层（base 变了会自动触发）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# 同一时刻只跑一个构建, 避免并发推送同一 tag。
concurrency:
  group: cli-image-build
  cancel-in-progress: false

jobs:
  rebuild:
    name: Build & push cubestack-installer-cli
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARBOR_HOST: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
      HARBOR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
      HARBOR_INSECURE: ${{ vars.HARBOR_MIRROR_INSECURE || 'false' }}
      IMAGE_VERSION: ${{ github.event.inputs.version || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed layers
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            build_base="${{ inputs.force_base }}"
            build_cli=true
          else
            before="${{ github.event.before }}"
            if [ -z "${before}" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse HEAD^)"
            fi
            changed="$(git diff --name-only "${before}" HEAD)"
            echo "changed files:"; printf '%s\n' "${changed}"
            build_base=false
            build_cli=false
            grep -qE '^images/installer-cli-base/' <<<"${changed}" && build_base=true
            grep -qE '^images/installer-cli/' <<<"${changed}" && build_cli=true
            grep -qE '^(deployments/scripts/|deployments/kubespray/|deployments/cubestack-addon/|deployments/config/|versions/|skills/|\.dockerignore$)' <<<"${changed}" \
              && build_cli=true
            # A base change is useless without rebuilding the code layer on top.
            [ "${build_base}" = "true" ] && build_cli=true
          fi
          echo "build_base=${build_base}" >> "${GITHUB_OUTPUT}"
          echo "build_cli=${build_cli}" >> "${GITHUB_OUTPUT}"
          echo "build_base=${build_base} build_cli=${build_cli}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Validate configuration
        run: |
          set -euo pipefail
          missing=0
          for v in HARBOR_HOST HARBOR_USER HARBOR_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::missing required configuration: ${v}"
              missing=1
            fi
          done
          [ "${missing}" = "0" ] || exit 1

      - name: Resolve target image
        run: |
          set -euo pipefail
          tag="${IMAGE_VERSION:-latest}"
          case "${tag}" in
            ''|*[!0-9A-Za-z._-]*) echo "::error::invalid version: ${tag}"; exit 1 ;;
          esac
          image="${HARBOR_HOST}/suanova/cubestack-installer-cli:${tag}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"
          echo "resolved image: ${image}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Login to Harbor
        env:
          HARBOR_USERNAME: ${{ env.HARBOR_USER }}
          HARBOR_SECRET: ${{ env.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${HARBOR_SECRET}" | docker login "${HARBOR_HOST}" -u "${HARBOR_USERNAME}" --password-stdin

      - name: Build CLI image
        if: steps.changes.outputs.build_cli == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.changes.outputs.build_base }}" = "true" ]; then
            bash deployments/scripts/tools/docker/build-cli-image.sh --base --engine docker
          else
            bash deployments/scripts/tools/docker/build-cli-image.sh --build --engine docker
          fi
          # build-cli-image.sh 固定产出 :latest; 需要版本 tag 时再打一层。
          built="harbor.isuanova.com/suanova/cubestack-installer-cli:latest"
          if [ "${IMAGE}" != "${built}" ]; then
            docker tag "${built}" "${IMAGE}"
          fi

      - name: Verify required tools are baked into image
        if: steps.changes.outputs.build_cli == 'true'
        run: |
          set -euo pipefail
          # patch 是 kubespray 补丁层的必需工具; 缺失会让补丁层静默跳过。
          docker run --rm --entrypoint bash "${IMAGE}" -lc \
            'command -v patch >/dev/null && patch --version | head -1'

      - name: Push base image
        if: steps.changes.outputs.build_base == 'true'
        run: |
          set -euo pipefail
          docker push "${HARBOR_HOST}/cubestack/cubestack-installer-cli-base:latest"

      - name: Push image
        if: steps.changes.outputs.build_cli == 'true'
        run: |
          set -euo pipefail
          push_log="${RUNNER_TEMP}/docker-push.log"
          docker push "${IMAGE}" 2>&1 | tee "${push_log}"
          # registry digest 是 Harbor/MinIO 一致性的锚点; docker push 最后一行含
          # "digest: sha256:..."。RepoDigests 作为兼容兜底(部分 Docker 版本)。
          digest="$(sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' "${push_log}" | tail -1)"
          if [ -z "${digest}" ]; then
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${IMAGE}" \
              | awk -F@ -v ref="${IMAGE}" '$1==ref {print $2; exit}')"
          fi
          [ -n "${digest}" ] || { echo "::error::无法解析 ${IMAGE} 的 registry digest"; exit 1; }
          echo "CLI_IMAGE_DIGEST=${digest}" >> "${GITHUB_ENV}"
          echo "pushed ${IMAGE} (${digest})" | tee -a "$GITHUB_STEP_SUMMARY"
