name: Mirror pin update (2.1)

# Thin receiver on the default branch. GitHub only delivers
# repository_dispatch to workflows registered here; the real baseline update
# runs from the 2.1 release branch.
#
# TODO(2.1): temporary shim. release-2.1 cannot merge to main yet, and
# repository_dispatch only reaches workflows on the default branch. Once the
# 2.1 branch is merged into main, delete this file and keep the normal receiver.

on:
  repository_dispatch:
    types: [mirror-updated]
  workflow_dispatch:
    inputs:
      catalog_commit:
        description: 'Mirror catalog commit (e.g. the merge commit on main)'
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One group per catalog commit: different commits must not replace each
  # other's pending run; the stale-commit guard rejects older ones.
  group: mirror-updated-base-${{ github.event.client_payload.catalog_commit || github.event.inputs.catalog_commit }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_BRANCH: ${{ vars.CUBESTACK_BASELINE_BRANCH || 'release-2.1' }}
      MIRROR_REPO: ${{ vars.MIRROR_REPO || 'suanova/container-image-mirror' }}
      COMMIT: ${{ github.event.client_payload.catalog_commit || github.event.inputs.catalog_commit }}
    steps:
      - name: Validate payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${COMMIT}" =~ ^[0-9a-f]{7,40}$ ]] \
            || { echo "::error::invalid catalog_commit: '${COMMIT}'"; exit 1; }
          resolved="$(gh api "repos/${MIRROR_REPO}/commits/${COMMIT}" --jq .sha)"
          [[ "${resolved}" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::cannot resolve catalog commit: ${COMMIT}"; exit 1; }
          echo "COMMIT=${resolved}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Reject stale catalog commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin_commit() {
            sed -n '/^mirror:/,/^[^ ]/s/^  commit:[[:space:]]*//p' "$1" \
              | head -1 \
              | sed 's/[[:space:]]*#.*//' \
              | tr -d "\"'" \
              | xargs
          }
          git fetch --quiet origin "${BASE_BRANCH}"
          git reset --hard "origin/${BASE_BRANCH}"
          current="$(pin_commit versions/base.yaml)"
          [ -n "${current}" ] || { echo "::error::versions/base.yaml has no mirror.commit"; exit 1; }
          [ "${current}" = "${COMMIT}" ] && exit 0
          status="$(gh api "repos/${MIRROR_REPO}/compare/${current}...${COMMIT}" --jq .status)"
          case "${status}" in
            ahead|identical) ;;
            *) echo "::error::stale catalog commit ${COMMIT} (${status} relative to ${current})"; exit 1 ;;
          esac

      - name: Fetch catalog
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/${MIRROR_REPO}/${COMMIT}/index.json" \
            -o "${RUNNER_TEMP}/mirror-index.json"

      - name: Update mirror pin
        run: |
          set -euo pipefail
          python3 deployments/scripts/tools/online/update-mirror-pin.py \
            --root . \
            --repo "${MIRROR_REPO}" \
            --commit "${COMMIT}" \
            --index "${RUNNER_TEMP}/mirror-index.json"

      - name: Recheck freshness before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin_commit() {
            sed -n '/^mirror:/,/^[^ ]/s/^  commit:[[:space:]]*//p' "$1" \
              | head -1 \
              | sed 's/[[:space:]]*#.*//' \
              | tr -d "\"'" \
              | xargs
          }
          git fetch --quiet origin "${BASE_BRANCH}"
          git show "origin/${BASE_BRANCH}:versions/base.yaml" \
            > "${RUNNER_TEMP}/live-base.yaml"
          live="$(pin_commit "${RUNNER_TEMP}/live-base.yaml")"
          [ -n "${live}" ] || { echo "::error::live baseline has no mirror.commit"; exit 1; }
          if [ "${live}" = "${COMMIT}" ]; then
            exit 0
          fi
          status="$(gh api "repos/${MIRROR_REPO}/compare/${live}...${COMMIT}" --jq .status)"
          case "${status}" in
            ahead|identical) ;;
            *)
              echo "::notice::base advanced to ${live}; skipping stale ${COMMIT} (${status})"
              echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Create GitHub App token
        id: app
        if: env.SKIP_PUBLISH != '1'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SUANOVA_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SUANOVA_BOT_APP_PRIVATE_KEY }}
          owner: suanova
          repositories: cubestack-installer
          permission-contents: write
          permission-pull-requests: write

      - name: Open pull request
        if: env.SKIP_PUBLISH != '1'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app.outputs.token }}
          base: ${{ env.BASE_BRANCH }}
          branch: chore/mirror-${{ env.COMMIT }}
          delete-branch: true
          title: "chore(base): bump mirror catalog pin"
          body: |
            Bump the mirror catalog pin to `${{ env.COMMIT }}`.

            This PR only moves `mirror.commit`; image versions are still
            selected in `versions/base.yaml`.
