name: Build netshoot-rdma image

# Builds the RDMA-enabled netshoot diagnostic image and optionally pushes it to
# the public Harbor project. The image is consumed by:
#   - cubestack-release: pinned as a base image and packaged into the version tree
#   - cubestack-installer open-source online install: materialized from public Harbor
#
# The tag is immutable: content changes must use a new tag (for example
# 26.04.17-r2). This workflow never overwrites an existing tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable image tag (e.g. 26.04.17 or 26.04.17-r2)'
        required: true
      perftest_version:
        description: 'perftest source version (default: tag without -rN suffix)'
        required: false
        default: ''
      push:
        description: 'Push to Harbor (uncheck for build-only validation)'
        type: boolean
        default: true
      apk_mirror:
        description: 'Optional apk mirror (e.g. https://mirrors.aliyun.com/alpine)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: netshoot-rdma-build
  cancel-in-progress: false

jobs:
  build:
    name: Build netshoot-rdma
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HARBOR_HOST: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
      HARBOR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
      IMAGE_TAG_INPUT: ${{ inputs.tag }}
      PERFTEST_INPUT: ${{ inputs.perftest_version }}
      PUSH_INPUT: ${{ inputs.push }}
      APK_MIRROR_INPUT: ${{ inputs.apk_mirror }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate inputs
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG_INPUT}"
          case "${tag}" in
            ''|*[!0-9A-Za-z._-]*|latest)
              echo "::error::invalid or forbidden tag: '${tag}' (no latest, no shell metacharacters)"
              exit 1 ;;
          esac
          echo "IMAGE_TAG=${tag}" >>"${GITHUB_ENV}"
          echo "PERFTEST_VERSION=${PERFTEST_INPUT:-${tag%-r*}}" >>"${GITHUB_ENV}"

      - name: Login to Harbor
        if: env.PUSH_INPUT == 'true'
        run: |
          set -euo pipefail
          if [[ -z "${HARBOR_USER:-}" || -z "${HARBOR_PASSWORD:-}" ]]; then
            echo "::error::HARBOR_MIRROR_USER / HARBOR_MIRROR_PASSWORD are required to push"
            exit 1
          fi
          echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_HOST}" -u "${HARBOR_USER}" --password-stdin

      - name: Build, self-check and optionally push
        env:
          NETSHOOT_IMAGE: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}/suanova/netshoot-rdma
        run: |
          set -euo pipefail
          args=(--online --tag "${IMAGE_TAG}" --no-save)
          if [[ "${PUSH_INPUT}" == "true" ]]; then
            args+=(--push)
          fi
          sudo env \
            NETSHOOT_RDMA_IMAGE="${NETSHOOT_IMAGE}" \
            PERFTEST_VERSION="${PERFTEST_VERSION}" \
            APK_MIRROR="${APK_MIRROR_INPUT}" \
            bash deployments/scripts/tools/images/netshoot-rdma-build.sh "${args[@]}"

      - name: Verify pushed digest
        if: env.PUSH_INPUT == 'true'
        env:
          NETSHOOT_IMAGE: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}/suanova/netshoot-rdma
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          ref="${NETSHOOT_IMAGE}:${IMAGE_TAG}"
          digest="sha256:$(skopeo inspect --raw "docker://${ref}" | sha256sum | cut -d' ' -f1)"
          [[ -n "${digest}" ]] || { echo "::error::cannot resolve pushed digest for ${ref}"; exit 1; }
          {
            echo "### netshoot-rdma pushed"
            echo ""
            echo "\`${ref}@${digest}\`"
          } >>"$GITHUB_STEP_SUMMARY"
