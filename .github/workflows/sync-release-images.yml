name: Sync release images to MinIO

# ============================================================================
# 组件镜像/chart 原地刷新: Harbor → MinIO <release>/offline-files/
#
# 触发:
#   · repository_dispatch: release-updated / release-2.0-updated(兼容)
#       {release, component, tag?, source_repo?, checkout_ref?}
#   · push 到 release-*: 版本定义变更(release.env / release-images.tsv)
#   · workflow_dispatch: 手动/首次 seed/恢复
#   · CLI tar 由 rebuild-cli-image.yml 在**同一 job** 内同步; 本 workflow 不再
#     监听 workflow_run(避免默认分支监听器缺失/滞后导致 Harbor 与 MinIO 不一致)。
#
# ⚠ 本文件在 main 与各 release-* 分支必须保持完全一致:
#   GitHub 的 repository_dispatch 只触发默认分支(main)上的 workflow;
#   push 触发使用被推送分支上的本文件, 因此每个 release 分支都要带同一份.
#
# Concurrency: GitHub keeps only one pending run per concurrency group, so a burst of
# pushes can replace a still-pending run. Recover a missed sync via workflow_dispatch.
# ============================================================================

on:
  repository_dispatch:
    types: [release-updated, release-2.0-updated]
  push:
    branches: ['release-*']
    paths:
      - 'deployments/releases/*/release.env'
      - 'deployments/releases/*/release-images.tsv'
  workflow_dispatch:
    inputs:
      release:
        description: 'MinIO release 目录 (如 2.0.0)'
        required: false
        default: '2.0.0'
      component:
        description: 'components.tsv 组件 (CSV; all/platform/publish/cli/bmc/...)'
        required: false
        default: 'all'
      tag:
        description: '可选: dispatch 的镜像 tag (用于 tag/env 一致性校验)'
        required: false
        default: ''
      source_repo:
        description: '可选: 触发组件仓库 (如 suanova/cubestack-operator)'
        required: false
        default: ''
      checkout_ref:
        description: 'checkout 的发布分支(留空=由 release 推导)'
        required: false
        default: ''
      force:
        description: '强制重拉/重传选中的镜像'
        type: boolean
        default: false
      dry_run:
        description: '只演练, 不上传'
        type: boolean
        default: false
      verify_remote:
        description: '上传后逐文件流式 sha256 校验'
        type: boolean
        default: true
      first_party_only:
        description: '只处理 first-party 行(跳过第三方依赖)'
        type: boolean
        default: false
      recover:
        description: '允许 _SUCCESS 缺失且无 marker 时手动恢复'
        type: boolean
        default: false
      keep_stale:
        description: '不删除选中子目录里旧 tag 的 tar'
        type: boolean
        default: false

permissions:
  contents: read

# 所有发布同步串行; 不做 cancel-in-progress(避免上传中途被取消).
concurrency:
  group: release-minio-writes
  cancel-in-progress: false

env:
  RELEASE: ${{ github.event.client_payload.release || github.event.inputs.release || '2.0.0' }}
  COMPONENT: ${{ github.event.client_payload.component || github.event.inputs.component || 'all' }}
  TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || '' }}
  SOURCE_REPO: ${{ github.event.client_payload.source_repo || github.event.inputs.source_repo || '' }}
  CHECKOUT_REF: ${{ github.event.client_payload.checkout_ref || github.event.inputs.checkout_ref || (github.event_name == 'push' && github.ref_name) || '' }}
  FORCE: ${{ github.event.inputs.force || 'false' }}
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  VERIFY_REMOTE_INPUT: ${{ github.event.inputs.verify_remote }}
  FIRST_PARTY_ONLY: ${{ github.event.inputs.first_party_only || 'false' }}
  RECOVER: ${{ github.event.inputs.recover || 'false' }}
  KEEP_STALE: ${{ github.event.inputs.keep_stale || 'false' }}
  HARBOR_MIRROR_REGISTRY: ${{ vars.HARBOR_MIRROR_REGISTRY || 'harbor.isuanova.com' }}
  HARBOR_MIRROR_USER: ${{ vars.HARBOR_MIRROR_USER || secrets.HARBOR_MIRROR_USER }}
  HARBOR_MIRROR_PASSWORD: ${{ secrets.HARBOR_MIRROR_PASSWORD }}
  HARBOR_MIRROR_INSECURE: ${{ vars.HARBOR_MIRROR_INSECURE || 'false' }}
  MINIO_ENDPOINT: ${{ secrets.MINIO_HOSTNAME }}
  MINIO_ACCESS_KEY: ${{ secrets.MINIO_USERNAME }}
  MINIO_SECRET_KEY: ${{ secrets.MINIO_PASSWORD }}
  MINIO_BUCKET: ${{ vars.MINIO_BUCKET || 'cubestack-installer' }}
  MINIO_INSECURE: ${{ vars.MINIO_INSECURE || 'false' }}
  CUBESTACK_OPERATOR_HARBOR_HOST: ${{ vars.CUBESTACK_OPERATOR_HARBOR_HOST || 'harbor.isuanova.com' }}
  CUBESTACK_OPERATOR_HARBOR_USER: ${{ vars.CUBESTACK_OPERATOR_HARBOR_USER || secrets.CUBESTACK_OPERATOR_HARBOR_USER }}
  CUBESTACK_OPERATOR_HARBOR_PASSWORD: ${{ secrets.CUBESTACK_OPERATOR_HARBOR_PASSWORD }}

jobs:
  release-list:
    name: Resolve release directories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releases: ${{ steps.resolve.outputs.releases }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve releases
        id: resolve
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
            case "${base}" in
              ''|0000000000000000000000000000000000000000)
                # New branch: diff against the default branch instead of the root commit,
                # otherwise every historical release dir would be synced.
                default_branch="${{ github.event.repository.default_branch }}"
                git fetch --no-tags origin "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
                base="$(git merge-base "${head}" "origin/${default_branch}")" ;;
            esac
            releases="$(git diff --name-only "${base}" "${head}" \
              -- 'deployments/releases/*/release.env' 'deployments/releases/*/release-images.tsv' \
              | awk -F/ '{print $3}' | sort -u | python3 -c \
                'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
            count="$(python3 -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "${releases}")"
            if [ "${count}" != "1" ]; then
              echo "::error::push event must touch exactly one release: ${releases}"
              exit 1
            fi
          else
            releases="$(RELEASE="${RELEASE}" python3 -c \
              'import json,os; print(json.dumps([os.environ["RELEASE"]]))')"
          fi
          ref="${CHECKOUT_REF:-}"
          if [ -z "${ref}" ]; then
            ref="$(python3 - "${releases}" <<'PY'
          import json, sys
          rels = json.loads(sys.argv[1])
          if len(rels) != 1:
              raise SystemExit("checkout_ref 缺失且 release 不是唯一值: " + repr(rels))
          m = rels[0].split(".")
          print(f"release-{m[0]}.{m[1]}")
          PY
          )"
          fi
          case "${ref}" in ''|*[!0-9A-Za-z._/-]*|*..*)
            echo "::error::invalid checkout_ref: ${ref}"; exit 1 ;; esac
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "releases: ${releases} (checkout_ref=${ref})" >> "$GITHUB_STEP_SUMMARY"

  sync:
    name: Sync ${{ matrix.release }}
    needs: release-list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # job 级覆盖: 校验与 checkout 都用 resolve 的结果, 不再依赖 workflow 级默认值
      CHECKOUT_REF: ${{ needs.release-list.outputs.checkout_ref }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.release-list.outputs.releases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-list.outputs.checkout_ref }}
          persist-credentials: false

      - name: Validate configuration
        env:
          MATRIX_RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          missing=0
          for v in MINIO_ENDPOINT MINIO_ACCESS_KEY MINIO_SECRET_KEY MATRIX_RELEASE; do
            if [ -z "${!v:-}" ]; then echo "::error::missing ${v}"; missing=1; fi
          done
          # 凭据必须成对: mirror 对或 operator 对任一完整即可; 不允许"一个来源的 user +
          # 另一个来源的 password"通过校验(release-sync-images.sh 也只会选完整的一对)。
          _harbor_pair=0
          if [ -n "${HARBOR_MIRROR_USER:-}" ] && [ -n "${HARBOR_MIRROR_PASSWORD:-}" ]; then _harbor_pair=1; fi
          if [ -n "${CUBESTACK_OPERATOR_HARBOR_USER:-}" ] && [ -n "${CUBESTACK_OPERATOR_HARBOR_PASSWORD:-}" ]; then _harbor_pair=1; fi
          if [ "${_harbor_pair}" != "1" ]; then
            echo "::error::missing complete Harbor credential pair (HARBOR_MIRROR_USER+HARBOR_MIRROR_PASSWORD or CUBESTACK_OPERATOR_HARBOR_USER+CUBESTACK_OPERATOR_HARBOR_PASSWORD)"; missing=1
          fi
          case "${MATRIX_RELEASE}" in ''|*[!0-9A-Za-z._-]*) echo "::error::invalid release: ${MATRIX_RELEASE}"; missing=1 ;; esac
          case "${CHECKOUT_REF}" in ''|*[!0-9A-Za-z._/-]*|*..*) echo "::error::invalid checkout_ref: ${CHECKOUT_REF}"; missing=1 ;; esac
          [ "${missing}" = "0" ] || exit 1
          echo "release=${MATRIX_RELEASE} component=${COMPONENT:-all} tag=${TAG:-<none>} checkout_ref=${CHECKOUT_REF}"

      - name: Reclaim disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install skopeo & mc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo
          curl -fsSL https://dl.min.io/aistor/mc/release/linux-amd64/mc -o /tmp/mc
          sudo install -m 0755 /tmp/mc /usr/local/bin/mc
          skopeo --version
          mc --version

      - name: Setup helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Preflight & sync
        env:
          MATRIX_RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          common=(--release "${MATRIX_RELEASE}")
          [ "${FORCE:-false}" = "true" ] && common+=(--force)
          [ "${RECOVER:-false}" = "true" ] && common+=(--recover)
          [ "${KEEP_STALE:-false}" = "true" ] && common+=(--keep-stale)
          [ "${VERIFY_REMOTE_INPUT:-true}" = "false" ] && common+=(--no-verify-remote)

          # Each invocation gets its own summary file; the script truncates it.
          run_group() {
            local summary="$1"; shift
            echo "::group::$*"
            bash deployments/scripts/tools/images/release-sync-images.sh "$@" --summary-file "${summary}" --preflight
            if [ "${DRY_RUN:-false}" = "true" ]; then
              bash deployments/scripts/tools/images/release-sync-images.sh "$@" --summary-file "${summary}" --dry-run
            else
              bash deployments/scripts/tools/images/release-sync-images.sh "$@" --summary-file "${summary}"
            fi
            echo "::endgroup::"
          }

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            run_group "${RUNNER_TEMP}/sync-summary-images.md" "${common[@]}" --component all --first-party-only
            run_group "${RUNNER_TEMP}/sync-summary-chart.md" "${common[@]}" --component operator-chart
          else
            args=("${common[@]}" --component "${COMPONENT:-all}")
            [ -n "${TAG:-}" ] && args+=(--tag "${TAG}")
            [ -n "${SOURCE_REPO:-}" ] && args+=(--source-repo "${SOURCE_REPO}")
            [ "${FIRST_PARTY_ONLY:-false}" = "true" ] && args+=(--first-party-only)
            run_group "${RUNNER_TEMP}/sync-summary.md" "${args[@]}"
          fi

      - name: Summary
        if: always()
        run: |
          found=0
          for f in "${RUNNER_TEMP}"/sync-summary*.md; do
            [ -f "${f}" ] || continue
            cat "${f}" >> "$GITHUB_STEP_SUMMARY"
            found=1
          done
          [ "${found}" = "1" ] || echo "no sync summary produced" >> "$GITHUB_STEP_SUMMARY"
