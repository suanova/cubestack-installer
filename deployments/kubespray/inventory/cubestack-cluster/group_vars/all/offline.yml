---
# 离线安装变量（由 cubestack-offline.sh 自动生成）

## 下载控制
download_run_once: true
download_localhost: true
download_force_cache: true
download_always_pull: false

## 缓存目录(运行时由 cubestack-offline.sh 写入实际路径, 文件直接位于离线根, 不按集群子目录)
download_cache_dir: "{{ offline_files_dir }}"
local_release_dir: "{{ offline_files_dir }}"

## 容器运行时
container_manager: "containerd"
container_manager_on_localhost: "containerd"

## 连接
ansible_user: "ubuntu"
ansible_become: true
ansible_become_method: sudo

## 离线环境 — 跳过不必要的检查
ping_access_ip: false

## 离线环境 API server 冷启动慢, 加大 kubeadm init 等待超时(默认300s)
kubeadm_init_timeout: 900s
