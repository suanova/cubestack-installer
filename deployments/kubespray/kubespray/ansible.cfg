[ssh_connection]
pipelining=True
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ConnectionAttempts=100 -o UserKnownHostsFile=/dev/null
# ⚠ 2026-10-13 扩容提速: 必须显式指定 control_path 才能复用 ControlMaster 连接。
#   默认 control_path 为空时, 每次新连接的 ControlPath 由 ssh 按 socket 路径长度随机生成,
#   两次连接互不匹配 → ControlMaster 永远新建连接(无复用)。实机日志: 每个远程任务
#   10~21s, 而命令本身 delta 仅 0.01~0.03s —— 150+ 个任务全部付了新建 SSH 连接的代价。
#   显式控制套接字后, 同一目标节点的所有任务/连接复用 master 连接(毫秒级)。
#   %% 是 ansible 转义(%%r/%%h/%%p 展开为 用户/主机/端口)。
control_path = ~/.ssh/ansible-%%r@%%h:%%p
[defaults]
# https://github.com/ansible/ansible/issues/56930 (to ignore group names with - and .)
force_valid_group_names = ignore

host_key_checking=False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp
fact_caching_timeout = 86400
timeout = 300
stdout_callback = default
display_skipped_hosts = no
library = ./library
callbacks_enabled = profile_tasks
roles_path = roles:$VIRTUAL_ENV/usr/local/share/kubespray/roles:$VIRTUAL_ENV/usr/local/share/ansible/roles:/usr/share/kubespray/roles
deprecation_warnings=False
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg
[inventory]
ignore_patterns = artifacts, credentials
