---
- name: Common tasks for every playbooks
  import_playbook: boilerplate.yml

- name: Gather facts
  import_playbook: facts.yml

- name: Prepare for etcd install
  hosts: k8s_cluster:etcd
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/preinstall, tags: preinstall }
    - { role: "container-engine", tags: "container-engine", when: deploy_container_engine }
    - { role: download, tags: download, when: "not skip_downloads" }

# ───────────────────────────────────────────────────────────────────────────
# 在 containerd 安装完成后, 预加载离线镜像到全部集群节点(解决新节点 kube-proxy/calico
# 等镜像缺失问题)。同步/加载逻辑见 patch-playbooks/cubestack-preload.yml(kubespray
# 升级后由 ensure_preload_play 自动恢复文件并重新挂载); 镜像目录由入口脚本写入
# offline.yml, 文件清单由入口脚本生成(preload-images.lst)
# ───────────────────────────────────────────────────────────────────────────
- name: Preload offline images to cluster nodes
  import_playbook: ../patch-playbooks/cubestack-preload.yml

# ──────────────────────────────────────────────────────────────────────
# 在内置 registry(LoadBalancer)就绪前, 在节点 /etc/hosts 写入 registry 域名解析,
# 配合 containerd certs.d HTTP 信任, 实现集群内节点拉取 registry.cubestack.io 镜像。
# 本 import 由入口脚本 ensure_registry_play 自动维护(kubespray 升级后重新挂载)
# ──────────────────────────────────────────────────────────────────────
- name: Configure nodes /etc/hosts for internal registry
  import_playbook: ../patch-playbooks/cubestack-registry.yml

- name: Install etcd
  vars:
    etcd_cluster_setup: true
    etcd_events_cluster_setup: "{{ etcd_events_cluster_enabled }}"
  import_playbook: install_etcd.yml

- name: Install Kubernetes nodes
  hosts: k8s_cluster
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/node, tags: node }

- name: Install the control plane
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/control-plane, tags: master }
    - { role: kubernetes/client, tags: client }
    - { role: kubernetes-apps/cluster_roles, tags: cluster-roles }

- name: Invoke kubeadm and install a CNI
  hosts: k8s_cluster
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/kubeadm, tags: kubeadm}
    - { role: kubernetes/node-label, tags: node-label }
    - { role: kubernetes/node-taint, tags: node-taint }
    - role: kubernetes-apps/gateway_api
      when: gateway_api_enabled
      tags: gateway_api
      delegate_to: "{{ groups['kube_control_plane'][0] }}"
      run_once: true
    - { role: network_plugin, tags: network }

- name: Install Calico Route Reflector
  hosts: calico_rr
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: network_plugin/calico/rr, tags: ['network', 'calico_rr'] }

- name: Patch Kubernetes for Windows
  hosts: kube_control_plane[0]
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: win_nodes/kubernetes_patch, tags: ["master", "win_nodes"] }

# ──────────────────────────────────────────────────────────────────────
# 在 Kubernetes + CNI 部署完成后、metallb 等 operator 安装之前, 重启
# containerd + kubelet, 确保 CNI 插件初始化(解决节点 NotReady / webhook 超时)。
# 逻辑见 patch-playbooks/cubestack-cni-restart.yml; 由入口脚本
# ensure_cni_restart_play 自动维护(kubespray 升级后重新挂载)。
# ──────────────────────────────────────────────────────────────────────
- name: Restart containerd + kubelet to (re)init CNI plugins
  import_playbook: ../patch-playbooks/cubestack-cni-restart.yml

- name: Install Kubernetes apps
  hosts: kube_control_plane
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes-apps/external_cloud_controller, tags: external-cloud-controller }
    - { role: kubernetes-apps/network_plugin, tags: network }
    - { role: kubernetes-apps/policy_controller, tags: policy-controller }
    - { role: kubernetes-apps/ingress_controller, tags: ingress-controller }
    - { role: kubernetes-apps/external_provisioner, tags: external-provisioner }
    - { role: kubernetes-apps, tags: apps }

- name: Apply resolv.conf changes now that cluster DNS is up
  hosts: k8s_cluster
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/preinstall, when: "dns_mode != 'none' and resolvconf_mode == 'host_resolvconf'", tags: resolvconf, dns_late: true }
