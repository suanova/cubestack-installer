---
- name: Common tasks for every playbooks
  import_playbook: boilerplate.yml

- name: Gather facts
  import_playbook: facts.yml

- name: Install etcd
  vars:
    etcd_cluster_setup: false
    etcd_events_cluster_setup: false
  import_playbook: install_etcd.yml

- name: Download images to ansible host cache via first kube_control_plane node
  hosts: kube_control_plane[0]
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults, when: "not skip_downloads and download_run_once and not download_localhost" }
    - { role: kubernetes/preinstall, tags: preinstall, when: "not skip_downloads and download_run_once and not download_localhost" }
    - { role: download, tags: download, when: "not skip_downloads and download_run_once and not download_localhost" }

- name: Target only workers to get kubelet installed and checking in on any new nodes(engine)
  hosts: kube_node
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/preinstall, tags: preinstall }
    - { role: container-engine, tags: "container-engine", when: deploy_container_engine }
    - { role: download, tags: download, when: "not skip_downloads" }
    - role: etcd
      tags: etcd
      vars:
        etcd_cluster_setup: false
      when:
        - etcd_deployment_type != "kubeadm"
        - kube_network_plugin in ["calico", "flannel", "canal", "cilium"] or cilium_deploy_additionally | default(false) | bool
        - kube_network_plugin != "calico" or calico_datastore == "etcd"

# ───────────────────────────────────────────────────────────────────────────
# 在 containerd 安装完成后, 预加载离线镜像到扩容节点(解决新节点 kube-proxy/calico
# 等镜像缺失问题)。同步/加载逻辑见 patch-playbooks/cubestack-preload.yml(kubespray
# 升级后由 ensure_preload_play 自动恢复文件并重新挂载); 镜像目录由入口脚本写入
# offline.yml, 文件清单由入口脚本生成(preload-images.lst)
# ───────────────────────────────────────────────────────────────────────────
- name: Preload offline images to scale nodes
  vars:
    preload_target: kube_node
  import_playbook: ../patch-playbooks/cubestack-preload.yml

# ──────────────────────────────────────────────────────────────────────
# 在内置 registry(LoadBalancer)就绪前, 在节点 /etc/hosts 写入 registry 域名解析,
# 配合 containerd certs.d HTTP 信任, 实现集群内节点拉取 registry.cubestack.io 镜像。
# 本 import 由入口脚本 ensure_registry_play 自动维护(kubespray 升级后重新挂载)
# ──────────────────────────────────────────────────────────────────────
- name: Configure nodes /etc/hosts for internal registry
  import_playbook: ../patch-playbooks/cubestack-registry.yml

- name: Target only workers to get kubelet installed and checking in on any new nodes(node)
  hosts: kube_node
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/node, tags: node }

- name: Upload control plane certs and retrieve encryption key
  hosts: kube_control_plane | first
  environment: "{{ proxy_disable_env }}"
  gather_facts: false
  tags: kubeadm
  roles:
    - { role: kubespray_defaults }
  tasks:
    - name: Upload control plane certificates
      command: >-
        {{ bin_dir }}/kubeadm init phase
        --config {{ kube_config_dir }}/kubeadm-config.yaml
        upload-certs
        --upload-certs
      environment: "{{ proxy_disable_env }}"
      register: kubeadm_upload_cert
      changed_when: false
    - name: Set fact 'kubeadm_certificate_key' for later use
      set_fact:
        kubeadm_certificate_key: "{{ kubeadm_upload_cert.stdout_lines[-1] | trim }}"
      when: kubeadm_certificate_key is not defined

- name: Target only workers to get kubelet installed and checking in on any new nodes(network)
  hosts: kube_node
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/kubeadm, tags: kubeadm }
    - { role: kubernetes/node-label, tags: node-label }
    - { role: kubernetes/node-taint, tags: node-taint }
    - { role: network_plugin, tags: network }

# ──────────────────────────────────────────────────────────────────────
# 在 Kubernetes + CNI 部署完成后、operator 安装之前, 重启 containerd + kubelet,
# 确保 CNI 插件初始化(解决新节点 NotReady / webhook 超时)。
# 逻辑见 patch-playbooks/cubestack-cni-restart.yml; 由入口脚本
# ensure_cni_restart_play 自动维护(kubespray 升级后重新挂载)。
# ──────────────────────────────────────────────────────────────────────
- name: Restart containerd + kubelet to (re)init CNI plugins
  import_playbook: ../patch-playbooks/cubestack-cni-restart.yml

- name: Apply resolv.conf changes now that cluster DNS is up
  hosts: k8s_cluster
  gather_facts: false
  any_errors_fatal: "{{ any_errors_fatal | default(true) }}"
  environment: "{{ proxy_disable_env }}"
  roles:
    - { role: kubespray_defaults }
    - { role: kubernetes/preinstall, when: "dns_mode != 'none' and resolvconf_mode == 'host_resolvconf'", tags: resolvconf, dns_late: true }
