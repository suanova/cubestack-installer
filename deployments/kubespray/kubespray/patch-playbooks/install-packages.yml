---
# ============================================================
# 离线安装 bare-metal worker 节点系统包
# 将 offline-files 中的 .deb 包复制到目标节点并安装
# 包来源: offline-files/kubespray/<集群>/*.deb(仓库根目录) + packages/ 子目录,
#         集群名取自当前 inventory(inventory_dir | basename), 无硬编码
# 路径说明: playbook 位于 kubespray/patch-playbooks/,
#           ../../offline-files/kubespray = deployments/offline-files/kubespray
# 用法:
#   ansible-playbook -i <inventory> install-packages.yml
# ============================================================
- name: Install required packages on worker nodes
  hosts: kube_node
  gather_facts: false
  vars:
    repo_base: "{{ playbook_dir }}/../../offline-files/kubespray/{{ inventory_dir | basename }}"
    packages_dirs:
      - "{{ repo_base }}"
      - "{{ repo_base }}/packages"

  tasks:
    - name: Ensure /tmp/packages directory exists on target
      file:
        path: /tmp/packages
        state: directory

    - name: Find offline .deb packages (仓库根目录 + packages/)
      find:
        paths: "{{ packages_dirs }}"
        patterns: "*.deb"
        file_type: file
      delegate_to: localhost
      register: deb_files

    - name: Copy offline .deb packages to target
      copy:
        src: "{{ item.path }}"
        dest: /tmp/packages/
      delegate_to: localhost
      loop: "{{ deb_files.files }}"
      when: deb_files.files | length > 0

    - name: Install packages from local files
      shell: dpkg -i /tmp/packages/*.deb && rm -rf /tmp/packages
      args:
        warn: false
      become: true

    - name: Verify required packages
      package_facts:
        manager: apt

    - name: Check installation status
      assert:
        that:
          - "'iputils-ping' in ansible_facts.packages"
          - "'rsync' in ansible_facts.packages"
          - "'iptables' in ansible_facts.packages"
          - "'curl' in ansible_facts.packages"
          - "'ca-certificates' in ansible_facts.packages"
        fail_msg: "Required packages missing on {{ inventory_hostname }}"
        success_msg: "All required packages installed on {{ inventory_hostname }}"