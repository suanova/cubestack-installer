# LWS 的 CubeStackCluster CR values(operator chart 全量部署使用)
# 与同目录 lws-values.yaml 保持同值, 只是多一层 clusterCR.spec.components.lws.values 包装。
#   · 只调度到 control-plane(master)节点(nodeSelector + tolerations)
#   · CPU request 200m; 不设置 limits
#   · memory request 保持上游默认 1Gi
clusterCR:
  spec:
    components:
      lws:
        values:
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node.kubernetes.io/unschedulable
              operator: Exists
              effect: NoSchedule
