# LWS 的唯一 values 源(CubeStackCluster CR 形态)。
#   · 全量部署: 25_cubestack_operator.sh 用 helm -f 应用本文件到 operator chart
#   · 单组件更新: 40_cubestack_lws.sh 按 CUBESTACK_COMPONENT_VALUES_KEY 取出
#     clusterCR.spec.components.lws.values 后 patch CR
#   · 本仓不再维护扁平的 lws-values.yaml(官方 helm install 路径不在本项目范围)
#   · 只调度到 control-plane(master)节点(nodeSelector + tolerations)
#   · 显式清空 requests(requests: null), 覆盖上游 LWS chart 默认的 1 CPU / 1Gi;
#     null 必须保留在 CR 里, 由 operator 的 Helm CoalesceValues 删除 chart 默认值
clusterCR:
  spec:
    components:
      lws:
        values:
          resources:
            requests: null
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node.kubernetes.io/unschedulable
              operator: Exists
              effect: NoSchedule
