# LWS 组件默认 values(cubestack-component-update.sh --steps lws 使用)
#   · 只调度到 control-plane(master)节点(nodeSelector + tolerations)
#   · CPU request 200m; 不设置 limits(requests 只是调度预留, 不是使用上限)
#   · memory request 保持上游默认 1Gi
resources:
  requests:
    cpu: 200m
    memory: 1Gi
nodeSelector:
  node-role.kubernetes.io/control-plane: ""
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node.kubernetes.io/unschedulable
    operator: Exists
    effect: NoSchedule
