# ============================================================
# CephFilesystem: cephfs(§7.2)
# Rook 自动创建 cephfs-metadata 与 cephfs-data0 两个 pool 并拉起 MDS。
# 设计: activeCount:2 双活跃 + 热备 + podAntiAffinity + 防误删。
# 模板变量: __NAMESPACE__ / __REPLICAS__ / __MIN_SIZE__(由 03_ceph_csi.sh sed 替换)
# ============================================================
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: cephfs
  namespace: __NAMESPACE__
spec:
  metadataPool:
    replicated: { size: __REPLICAS__, requireSafeReplicaSize: true }
    failureDomain: host
  dataPools:
    - name: data0
      replicated: { size: __REPLICAS__, requireSafeReplicaSize: true }
      failureDomain: host
      parameters:
        compression_mode: none
  metadataServer:
    activeCount: 2
    activeStandby: true
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    priorityClassName: system-cluster-critical
    placement:
      # ★ 2026-09-29: MDS 也是**存储守护进程**(往宿主机 /var/lib/rook 写数据),
      #   必须和 mon/osd/mgr 一样钉在存储节点 —— 否则 Rook 会把它调度到 worker(实机踩过:
      #   cephfs 的 MDS 落在 mxgpu-3-36), 还会带出 crashcollector/exporter 一起写到 worker。
      #   ⚠ 这里是 CephFilesystem 的 placement, 与 CephCluster 的 placement 是两套字段 ——
      #     只在 CephCluster 里写 mon/osd/mgr 管不到 MDS/RGW(这就是当初漏掉的原因)。
      #   ⚠ 不要图省事改用 CephCluster 的 `placement.all`: 它会被一并套到 CSI daemonset 上,
      #     把必须跑在每个节点的 rbd/cephfs nodeplugin 钉死在存储节点 → worker 上的卷挂不上。
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: __STORAGE_LABEL_KEY__
                  operator: In
                  values:
                    - __STORAGE_LABEL_VALUE__
      podAntiAffinity:
        # ★ 2026-09-29 由 required 改为 preferred(软): 存储节点只有 3 台, 而 MDS 数量会超过 3 ——
        #   内部 cephfs(activeCount:2 + activeStandby:true)= 4 个 pod(2 active + 2 standby-replay)
        #   + 外部 cubestack-ext-fs = 1 个, 共 **5 个**; 加上 nodeAffinity 只认 3 台存储节点后,
        #   required 反亲和会让第 4 个 MDS **永远 Pending**(实机 2026-09-29 复现:
        #   FailedScheduling "3 node(s) didn't match pod anti-affinity rules")并让集群停在
        #   HEALTH_WARN(insufficient standby MDS daemons)。软亲和保留"尽量分散"的意图,
        #   但不会在节点故障/数量不足时把 pod 卡死。
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [rook-ceph-mds]
              topologyKey: kubernetes.io/hostname
  preserveFilesystemOnDelete: true
