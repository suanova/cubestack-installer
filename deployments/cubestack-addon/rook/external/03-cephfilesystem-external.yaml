# ============================================================
# CephFilesystem: 外部专用 CephFS(默认 cubestack-ext-fs, §3.3 预定义)
# ⚠ 必须用 CephFilesystem CR 创建, 不能用 `ceph fs new` CLI ——
#   CLI 建的 fs 没有 MDS 守护进程(MDS 只由 Rook 依据 CR 部署),
#   fs 永久 offline → 提供方 HEALTH_ERR(1 filesystem is offline),
#   消费方 cephfs-* StorageClass 无法 provision(2026-09-09 实机事故)。
# 已存在同名 fs/pool(历史 CLI 建的)时 Rook 自动接管, 幂等;
# preservePoolsOnDelete: 删 CR 不删 pool(数据保护)。
# 模板变量: __NAMESPACE__ / __FS_NAME__ / __FS_META_POOL__ / __FS_DATA_POOL__ /
#           __REPLICAS__ / __MIN_SIZE__(由 ceph-expose-external.sh sed 替换)
# ============================================================
apiVersion: ceph.rook.io/v1
kind: CephFilesystem
metadata:
  name: __FS_NAME__
  namespace: __NAMESPACE__
spec:
  metadataPool:
    replicated: { size: __REPLICAS__, requireSafeReplicaSize: true }
    failureDomain: host
  dataPools:
    - name: __FS_DATA_POOL__
      replicated: { size: __REPLICAS__, requireSafeReplicaSize: true }
      failureDomain: host
  preservePoolsOnDelete: true
  metadataServer:
    activeCount: 1
    activeStandby: false
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        memory: "1Gi"
    priorityClassName: system-cluster-critical
    placement:
      # ★ 2026-09-29: 与内部 cephfs 同理 —— MDS 是存储守护进程, 必须钉在存储节点
      #   (实机踩过: cubestack-ext-fs 的 MDS 落在 worker mxgpu-3-32)。
      #   本 FS 只有 1 个 MDS(activeCount:1, activeStandby:false), 钉住可避免它漂到
      #   非存储节点后, 外部消费方的挂载依赖 worker 可用性。
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: __STORAGE_LABEL_KEY__
                  operator: In
                  values:
                    - __STORAGE_LABEL_VALUE__
      podAntiAffinity:
        # ★ 2026-09-29 由 required 改为 preferred(软): 存储节点只有 3 台, 而 MDS 数量会超过 3 ——
        #   内部 cephfs(activeCount:2 + activeStandby:true)= 4 个 pod(2 active + 2 standby-replay)
        #   + 外部 cubestack-ext-fs = 1 个, 共 **5 个**; 加上 nodeAffinity 只认 3 台存储节点后,
        #   required 反亲和会让第 4 个 MDS **永远 Pending**(实机 2026-09-29 复现:
        #   FailedScheduling "3 node(s) didn't match pod anti-affinity rules")并让集群停在
        #   HEALTH_WARN(insufficient standby MDS daemons)。软亲和保留"尽量分散"的意图,
        #   但不会在节点故障/数量不足时把 pod 卡死。
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: [rook-ceph-mds]
              topologyKey: kubernetes.io/hostname
