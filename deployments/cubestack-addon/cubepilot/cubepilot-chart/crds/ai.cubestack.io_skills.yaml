---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: skills.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: Skill
    listKind: SkillList
    plural: skills
    singular: skill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: DisplayName
      type: string
    - jsonPath: .spec.visibility
      name: Visibility
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Skill is the skill catalog entry (design §3.4). Generic tools are
          platform-provided and need no registration.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SkillSpec is a marketplace skill (design §3.4). It registers "what skill
              exists, where, which version, who can see it"; the content lives in the
              repository.
            properties:
              description:
                description: Description explains when to use the skill.
                type: string
              displayName:
                description: DisplayName is the market-facing title.
                type: string
              source:
                description: |-
                  Source addresses the skill content (discriminant type; CEL enforces the
                  mutually exclusive Path/S3 branches on the API server).
                properties:
                  path:
                    description: |-
                      Path is the repo-relative tar path (e.g. skills/harbor/v1.tar.gz),
                      versioned and immutable. Required when type=Path.
                    type: string
                  s3:
                    description: |-
                      S3 is the object-store addressing. Forbidden when type=Path. Not
                      accepted anywhere yet: the catalog rejects type=S3.
                    properties:
                      bucket:
                        type: string
                      key:
                        type: string
                    required:
                    - bucket
                    - key
                    type: object
                  sha256:
                    description: |-
                      Sha256 is the content fingerprint, backfilled by publish/seed. Optional:
                      manual kubectl apply may leave it empty (audit via the versioned path).
                    type: string
                  type:
                    description: 'Type is the discriminant: Path | S3.'
                    enum:
                    - Path
                    - S3
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: source.type=Path requires source.path and forbids source.s3
                  rule: 'self.type==''Path'' ? has(self.path) && !has(self.s3) : true'
                - message: source.type=S3 requires source.s3 and forbids source.path
                  rule: 'self.type==''S3'' ? has(self.s3) && !has(self.path) : true'
              visibility:
                description: |-
                  Visibility is Platform | Tenant | User. Only Platform is accepted: the
                  publish path and the catalog reject the others.
                enum:
                - Platform
                - Tenant
                - User
                type: string
            required:
            - displayName
            - source
            - visibility
            type: object
          status:
            description: SkillStatus is the observed state of a Skill.
            properties:
              conditions:
                description: Conditions carry condition details.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase is Available | Unreachable. Set by the seed/publish flow after the
                  tar is written to the repository.
                enum:
                - Available
                - Unreachable
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
