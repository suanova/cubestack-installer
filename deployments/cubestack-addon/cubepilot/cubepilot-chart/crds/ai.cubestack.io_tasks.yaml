---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tasks.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: Task
    listKind: TaskList
    plural: tasks
    singular: task
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef
      name: Template
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .spec.state
      name: State
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Task is a task instance (design §3.3.3) -- the "object" of the task domain:
          who owns it, when it runs, which Agent executes it. The scheduler reads
          Task CRDs and writes TaskRun (written with the platform identity, credential
          minimization).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TaskSpec is a task instance (design §3.3.3) -- whose task, when it runs. It
              links the
              execution subject (agentRef -> Agent) with the task content (templateRef ->
              TaskTemplate); creator decides the execution identity.

              A Task is either bound to a TaskTemplate or free-form, and params only mean
              something with a template. "At least one", not "exactly one": a
              template-bound Task carries both, because the stored instruction is the
              rendered snapshot kept as the fallback for when the template is deleted.

              Each side tests the value, not just presence -- has() is true for an
              explicitly empty string, and the API handler trims before comparing, so a
              blank value must fail here too, for either side. The blank test uses
              matches() rather than trim(): matches is core CEL, while trim() comes from
              the ext.Strings library whose escaping convention is copied below from the
              proven matches('.*\\s.*') rule on TemplateProviderSpec.Models.
            properties:
              cron:
                description: |-
                  Cron is the 5-field cron expression. Empty means the task never fires on
                  its own and runs only when asked (there is no separate trigger field: it
                  was derivable from this one, and the two could disagree silently -- a
                  task with trigger=Cron and an empty cron simply never ran).
                type: string
              instruction:
                description: Instruction is the inline prompt (used when TemplateRef
                  is empty).
                type: string
              owner:
                description: |-
                  Owner is the task owner; execution identity = owner (RBAC matches the
                  owner; the per-user instance is derived from it -- design §3.5: one
                  cubepilot instance per user, no agentInstanceRef).
                type: string
              params:
                additionalProperties:
                  type: string
                description: Params overrides template parameter defaults.
                type: object
              state:
                default: Enabled
                description: |-
                  State is the task enablement state (design §3.5: string enum, not
                  bool): Enabled fires on schedule, Paused never fires.
                enum:
                - Enabled
                - Paused
                type: string
              templateRef:
                description: |-
                  TemplateRef points to the TaskTemplate. Optional: a Task may instead
                  carry an inline instruction (the XValidation rules on TaskSpec require
                  one of the two).
                type: string
            required:
            - owner
            type: object
            x-kubernetes-validations:
            - message: a task needs a templateRef or a non-blank instruction
              rule: (has(self.templateRef) && !self.templateRef.matches('^\\s*$'))
                || (has(self.instruction) && !self.instruction.matches('^\\s*$'))
            - message: params require a templateRef
              rule: '!has(self.params) || (has(self.templateRef) && !self.templateRef.matches(''^\\s*$''))'
          status:
            description: TaskStatus is the observed state of a Task.
            properties:
              lastRunTime:
                description: LastRunTime is the last successful scheduling time.
                format: date-time
                type: string
              lastStatus:
                description: LastStatus is the last run outcome.
                enum:
                - success
                - failed
                type: string
              lastTaskRunName:
                description: LastTaskRunName is the most recent TaskRun created for
                  this Task.
                type: string
              nextRunTime:
                description: NextRunTime is the computed next fire time.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
