---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentinstances.ai.cubestack.io
spec:
  group: ai.cubestack.io
  names:
    kind: AgentInstance
    listKind: AgentInstanceList
    plural: agentinstances
    singular: agentinstance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateRef
      name: Template
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.podName
      name: Pod
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentInstance is the runtime instance of an AgentTemplate for one user
          (design §3.2). It is reconciled by the Instance Manager controller:
          provision / self-heal / data-directory GC. The instance key is user +
          template (one instance per user per template, single-writer).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentInstanceSpec is the runtime instance of an AgentTemplate definition for
              one tenant (design §3.2). The instance key is `user + template` -- one
              instance per user per template, single-writer.
            properties:
              allowlist:
                description: |-
                  Allowlist is the instance's own safe-command allowlist: the rules the
                  user added by hand. Learned allow-always grants live in the per-user
                  grants ConfigMap, not here (issue #185) -- the chat approval path records
                  them there, and a client must not copy them back into this field, where
                  they would survive a revocation. The effective list is the union of the
                  platform builtin, the template allowlist and these entries: the instance
                  adds to it and cannot remove from it. A client PUTting this field
                  replaces it wholesale, so it must send back every entry it means to keep.
                items:
                  description: |-
                    AllowlistRule is one entry of a safe-command allowlist (issue #116). The
                    grammar is runtime-shaped today ({pattern, argPattern?} -- the OpenClaw argv
                    allowlist shape the builtin default uses); a runtime-neutral grammar is
                    deferred until a second runtime lands. Pattern is the command/executable;
                    ArgPattern optionally constrains the remaining argv (empty = any argv).
                  properties:
                    argPattern:
                      description: ArgPattern optionally constrains the remaining
                        argv (empty = any argv).
                      type: string
                    pattern:
                      description: Pattern is the command executable or glob to allow
                        (e.g. "kubectl").
                      type: string
                  required:
                  - pattern
                  type: object
                type: array
              approvalPolicy:
                description: |-
                  ApprovalPolicy optionally overrides the template's approvalPolicy (issue
                  #116, design §3.2 inherit-or-own): empty = follow the template default
                  (live); set = the instance's own posture.
                enum:
                - None
                - Allowlist
                - AlwaysAsk
                type: string
              dataVolume:
                description: DataVolume is the per-instance data directory.
                properties:
                  size:
                    description: Size is the requested capacity (default 1Gi, applied
                      in code).
                    type: string
                type: object
              enabledSkills:
                description: |-
                  EnabledSkills optionally restricts the skills the AgentTemplate declares
                  (design §3.2: the instance may enable a subset; empty = all declared).
                items:
                  type: string
                type: array
              owner:
                description: Owner is the user the instance belongs to.
                type: string
              selectedModel:
                description: |-
                  SelectedModel optionally selects a model by its ref
                  "<provider>/<modelId>", one of the model ids of the providers inlined in
                  the template (overrides defaultModel). Design §3.2.
                type: string
              templateRef:
                description: |-
                  TemplateRef points to the AgentTemplate definition (e.g.
                  cubepilot). Not pinned to a revision -- template updates take
                  effect on the next reconcile/restart (design §3.1/§3.2).
                type: string
              userInstructions:
                description: |-
                  UserInstructions optionally appends user preferences to the definition
                  default system prompt (design §3.2: appended after the template
                  instructions; cannot remove or weaken security/identity bounds).
                type: string
            required:
            - owner
            - templateRef
            type: object
          status:
            description: |-
              AgentInstanceStatus is the observed state of an instance (design §3.2,
              written by the Instance Manager controller -- users do not edit it).
            properties:
              conditions:
                description: Conditions carries detail (Ready / Reclaiming / Failed
                  reason).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              message:
                description: Message is a human-readable status detail.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed.
                format: int64
                type: integer
              phase:
                description: Phase is Creating / Ready / Failed.
                type: string
              podName:
                description: PodName is the running agent Pod (empty when not running).
                type: string
              pvcName:
                description: PVCName is the per-instance data PVC.
                type: string
              serviceName:
                description: ServiceName is the ClusterIP service exposing the gateway.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
