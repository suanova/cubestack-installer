# CubePilot Helm values -- registry-addressed defaults
# (harbor.isuanova.com/suanova). The default :latest tags track the rolling
# builds published from main (see .github/workflows/release.yaml); pin a real
# release by overriding the image refs (e.g. --set operator.image=...:0.1.0).
# scripts/setup.sh always passes explicit image refs, so local development is
# unaffected.

# --- shared ---------------------------------------------------------------
# Image pull policy for every image the platform runs: the operator / api /
# web Deployments and the per-user agent Pods the operator creates. The default
# suits a local kind install, where scripts/setup.sh side-loads the built
# images instead of pushing them; an install that tracks the rolling :latest
# builds published from main sets it to Always.
imagePullPolicy: IfNotPresent

# Agent runtime config (per-user OpenClaw instances, design §5).
# runtime names the agent runtime image family: openclaw today, hermes later.
agents:
  runtime: openclaw
  image: harbor.isuanova.com/suanova/cubepilot-openclaw:latest
  # Comma-separated operator identities, one independent instance each.
  # Default: a single 'admin'. Add users here and re-deploy -- the operator
  # mints a per-user identity (SA + kubeconfig Secret) for each at deploy time.
  users: admin
  # Platform default LLM (optional). Both are empty by default: the builtin
  # cubepilot template is created with no provider and LLMs are
  # added from the Portal (Agent Config -> LLM Config). Set an endpoint AND a
  # model id to seed a ready default provider at template creation (a provider
  # named "platform" serving that one model id; its apiKey comes from the
  # cubepilot-llm Secret; the builtin deepseek defaults that scripts/setup.sh
  # passes are examples, not chart defaults).
  llmEndpoint: ""
  llmModel: ""
  # Resident lifecycle: started instances stay up; no idle reclaim.
  gcWindow: 72h
  gcWatermark: "0.7"

# Secrets. Names are fixed in Go (internal/k8s), not configurable here:
#   openclaw-config   generated by the operator (gateway token + openclaw.json)
#   agent-kubeconfig  rendered by this chart (see templates/agent-kubeconfig.yaml)
#   cubepilot-llm     created by scripts/setup.sh (platform default LLM apiKey);
#                     additional LLM apiKeys land in llm-<provider> Secrets
#                     created from the Portal (Agent Config -> LLM Config)

# --- operator (control plane, leader election, no HTTP/PVC) --------------
operator:
  name: cubepilot-operator
  replicas: 2
  image: harbor.isuanova.com/suanova/cubepilot-operator:latest
  # controller-runtime metrics + health/ready probes ("0" disables).
  metricsAddr: :8082
  probeAddr: :8081
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- api (Portal REST/SSE + JSON metadata store, single PVC) ------------
api:
  name: cubepilot-api
  replicas: 1
  image: harbor.isuanova.com/suanova/cubepilot-api:latest
  # One claim backs both the API's JSON metadata (at the {{ .Values.api.dataDir }}
  # root) and the skill repository ({{ .Values.api.dataDir }}/skills -- the app
  # mkdirs them).
  dataDir: /opt/cubepilot/data
  storage: 1Gi
  # Access mode of the single API claim. ReadWriteOnce is the default (works
  # on kind's local-path StorageClass; the API is single-replica). Production
  # API replicas > 1 set [ReadWriteMany] with a shared CephFS/NFS StorageClass
  # -- note RWX alone does not make the API multi-replica: its JSON metadata
  # store is single-writer and per-session state (SSE / HITL) is in-memory, so
  # app-level state handling is the real gate.
  storageClassName: ""
  accessModes: [ReadWriteOnce]
  resources: {}
  nodeSelector: {}
  tolerations: []
  # Human-in-the-loop write confirmations (issue #20 / #127) are always on:
  # the API auto-generates and persists a device master key in a Secret (no
  # operator key to supply) and the in-pod supervisors auto-pair the derived
  # per-user devices. Whether an agent's writes are gated is decided solely by
  # its confirmPolicy (None | Allowlist | AlwaysAsk) -- there is no deployment
  # switch.
  # extraEnv appends arbitrary environment variables to the API container.
  # Each entry is {name, value} for a literal, or
  # {name, secretKeyRef:{name, key}} to source a secret.
  extraEnv: []

# --- web (independent React SPA, stateless, nginx) ------------------------
web:
  # enabled installs the standalone web portal (React SPA). Set to false to
  # skip it -- e.g. when CubeStack provides a unified UI that talks to the
  # cubepilot API directly. The api + operator remain fully installable
  # without the portal.
  enabled: true
  name: cubepilot-web
  replicas: 2
  image: harbor.isuanova.com/suanova/cubepilot-web:latest
  resources: {}
  nodeSelector: {}
  tolerations: []

# --- service accounts ------------------------------------------------------
serviceAccounts:
  operator: cubepilot-operator
  api: cubepilot-api
  agent: cubepilot-agent
