# Operator -- platform controllers (AgentInstance / builtin bootstrap / CRD
# scheduler). Leader election on; no HTTP listener, no PVC (design §9 / §11.1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.operator.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.operator.name }}
        {{- include "cubepilot.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.operator }}
      containers:
        - name: operator
          image: {{ .Values.operator.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            {{- include "cubepilot.agentEnv" . | nindent 12 }}
            - name: CUBEPILOT_LLM_ENDPOINT
              value: {{ .Values.agents.llmEndpoint | quote }}
            - name: CUBEPILOT_LLM_MODEL
              value: {{ .Values.agents.llmModel | quote }}
            - name: CUBEPILOT_METRICS_ADDR
              value: {{ .Values.operator.metricsAddr | quote }}
            - name: CUBEPILOT_PROBE_ADDR
              value: {{ .Values.operator.probeAddr | quote }}
          ports:
            - name: metrics
              containerPort: 8082
            - name: probe
              containerPort: 8081
          {{- if ne .Values.operator.probeAddr "0" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            periodSeconds: 5
          {{- end }}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# Headless: nothing routes to the operator (no HTTP); keeps the component
# discoverable for pod identity/owner labels.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.operator.name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app: {{ .Values.operator.name }}
