{{- if .Values.web.enabled }}
# Web -- independent frontend component (design §9 / §11.1). Serves the built
# React SPA and reverse-proxies /api to the API service (web/nginx.conf).
# Replicas > 1 is safe: the SPA is fully stateless. Gated by web.enabled so an
# environment with its own UI (e.g. CubeStack unified UI) can skip the portal.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.web.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.web.name }}
        {{- include "cubepilot.labels" . | nindent 8 }}
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.web.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.web.name }}
  ports:
    - port: 80
      targetPort: 80
---
# Portal entry -- the web component (nginx) reverse-proxies /api to the API
# service. Kept as a stable entry name for port-forward / Ingress.
apiVersion: v1
kind: Service
metadata:
  name: cubepilot
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .Values.web.name }}
  ports:
    - port: 8080
      targetPort: 80
{{- end }}
