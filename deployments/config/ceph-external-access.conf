# ============================================================
# CubeStack Ceph 外部接入配置(供集群 B 以 CEPH_MODE=external 接入集群 A)
# 本文件是【示例结构】(真实 key 已替换为占位), 由 A 侧 ceph-expose-external.sh 生成后
# 拷贝到目标集群 B 的 cluster.conf 即可接入。勿提交真实 key。
# 生成命令(A 侧): bash deployments/scripts/tools/k8s/ceph-expose-external.sh apply
# 文件版本: 基于 2026-09-08 集群 A(10.244.1.201/202/203 VIP, fsid a9e8cb26-…) 的实际结构
# ============================================================
CEPH_MODE="external"
CEPH_MONITORS="10.244.1.201:6789,10.244.1.202:6789,10.244.1.203:6789"   # A 的 mon-external VIP(替换为 A 实际)
CEPH_FSID="a9e8cb26-2a6b-4ad4-80fd-5d6403c0f3d6"                            # A 的 fsid
# ---RBD(ceph-csi RBD provisioner 使用) ---
CEPH_POOL="cubestack-ext-rbd-pool"
CEPH_USER="cubestack-ext-rbd"
CEPH_KEYRING="<请从 A 侧 ceph-external-access.conf 拷贝真实 KEY, 勿提交真实值>"   # ⚠ 服务到真实
# --- CephFS(ceph-csi CephFS provisioner 使用) ---
CEPHFS_FS="cubestack-ext-fs"
CEPHFS_META_POOL="cubestack-ext-cephfs-metadata"
CEPHFS_DATA_POOL="cubestack-ext-cephfs-data"
CEPHFS_USER="cubestack-ext-cephfs"
CEPHFS_KEYRING="<请从 A 侧拷贝真实 KEY; 勿提交真实值>"  # ⚠ 占位
# --- RGW(S3, 供外部应用如 Model 仓库; csi-operator 不需要) ---
CEPH_RGW_EXTERNAL_ENDPOINT="10.244.1.204:80"
# ============================================================
# 引用: docs/ceph-rook.md §3.4 两集群 A/B 流程
