# ---------------- 4.7b NVIDIA GPU Operator(详见 docs/nvidia-gpu-operator.md) ----------------
# 驱动策略 = 预编译驱动容器(免内核包下载; 驱动镜像 driver:<分支>-<内核>-ubuntu22.04 由 operator 依 NFD 标签组合):
