# ============================================================
# CubeStack 高级/默认值配置 —— cluster.defaults.conf
# ============================================================
# 由 load_config 在 cluster.conf **之后**自动加载(${VAR:-default} 自默认, 只补未定义变量)。
# 优先级: 环境变量 > cluster.conf > cluster.defaults.conf —— 覆盖时在 cluster.conf 写同名变量。
# 分节: ★升级入口(版本基线/镜像钉子) / ★API 入口细节 / 基础(§1-2) / 基础设施(§3) / 组件(§4)
#   (在线部署开关已上移主文件 cluster.conf, 2026-10-16)
# ============================================================

# ════════════════════════════════════════════════════════════
# ★ 版本基线(升级时改; 变更须重跑 k8s_deploy)
# ════════════════════════════════════════════════════════════
# kubespray 版本(单一开关; 目录名 = 上游 tag 全名, 如 v2.32.0; 留空 = 仓库当前树版本)
KUBESPRAY_VERSION="${KUBESPRAY_VERSION:-}"
K8S_VERSION="${K8S_VERSION:-v1.35.8}"                    # kube-apiserver/controller-manager/scheduler/proxy
# 版本套装档案: 该版本成套版本钉子; 档案 > cluster.conf > defaults; none = 不用档案
#   ⚠ 显式选定的档案缺失会**硬失败**(防静默退化成"别的版本的钉子")
KUBESPRAY_PROFILE="${KUBESPRAY_PROFILE:-}"

# ---- 镜像版本钉子(被 images.manifest 以 ${VAR} 引用; ⚠ 改完必须重新同步制品) ----
PAUSE_VERSION="${PAUSE_VERSION:-3.10.1}"
COREDNS_VERSION="${COREDNS_VERSION:-v1.12.4}"
DNS_NODE_CACHE_VERSION="${DNS_NODE_CACHE_VERSION:-1.25.0}"
METRICS_SERVER_VERSION="${METRICS_SERVER_VERSION:-v0.9.0}"
CPA_VERSION="${CPA_VERSION:-v1.10.3}"                    # cluster-proportional-autoscaler
ETCD_VERSION="${ETCD_VERSION:-v3.6.14}"
CALICO_VERSION="${CALICO_VERSION:-v3.32.2}"
METALLB_VERSION="${METALLB_VERSION:-v0.13.9}"
KUBE_VIP_VERSION="${KUBE_VIP_VERSION:-v1.0.3}"           # ⚠ 必须与 kubespray download.yml 的 kube_vip_version 一致(镜像 tag = "v"+该值), 否则离线拉不到镜像
REGISTRY_IMAGE_TAG="${REGISTRY_IMAGE_TAG:-2.8.1}"        # docker.io/library/registry
LOCAL_PATH_VERSION="${LOCAL_PATH_VERSION:-v0.0.37}"      # rancher/local-path-provisioner(与树内 download.yml 同值)
LOCAL_VOLUME_PROVISIONER_VERSION="${LOCAL_VOLUME_PROVISIONER_VERSION:-2.5.0}"
NFD_VERSION="${NFD_VERSION:-0.19.0}"
BUSYBOX_TAG="${BUSYBOX_TAG:-latest}"                     # 验证用(registry 存储校验)
NGINX_TAG="${NGINX_TAG:-1.27}"                           # 验证用(verify 模块测试后端; 见 ensure_registry_nginx)
API_LB_NGINX_IMAGE_TAG="${API_LB_NGINX_IMAGE_TAG:-1.30.1-alpine}"  # API 本地代理静态 Pod 用; ⚠ 必须与树内 download.yml 的 nginx_image_tag 同值
# Ceph CSI 附属组件(随 CEPH_ENABLED/CEPH_CSI_ENABLED)
CSIADDONS_SIDECAR_VERSION="${CSIADDONS_SIDECAR_VERSION:-v0.14.0}"
CSI_ATTACHER_VERSION="${CSI_ATTACHER_VERSION:-v4.12.0}"
CSI_NODE_DRIVER_REGISTRAR_VERSION="${CSI_NODE_DRIVER_REGISTRAR_VERSION:-v2.17.0}"
CSI_PROVISIONER_VERSION="${CSI_PROVISIONER_VERSION:-v6.2.0}"
CSI_RESIZER_VERSION="${CSI_RESIZER_VERSION:-v2.1.0}"
CSI_SNAPSHOTTER_VERSION="${CSI_SNAPSHOTTER_VERSION:-v8.5.0}"
SNAPSHOT_CONTROLLER_VERSION="${SNAPSHOT_CONTROLLER_VERSION:-v8.0.1}"

# ════════════════════════════════════════════════════════════
# ★ API 入口细节(开关 KUBE_VIP_ENABLED / VIP 地址 K8S_API_VIP 在主文件)
# ════════════════════════════════════════════════════════════
KUBE_VIP_INTERFACE="${KUBE_VIP_INTERFACE:-}"            # 留空=自动检测网卡; 多网卡环境显式指定(如 ens5)
KUBE_VIP_CP_DETECT="${KUBE_VIP_CP_DETECT:-false}"       # apiserver 进程级故障检测; true=探 /healthz 失败即让 VIP 漂移(代价: 抖动可能误迁移)
# API 入口来源: 三选一(external > vip > node); ⚠ KUBE_VIP_ENABLED 与 API_EXTERNAL_ADDR 同给会硬失败
API_EXTERNAL_ADDR="${API_EXTERNAL_ADDR:-}"              # 环境已有 LB/VIP 地址(留空=不用)
API_LOCAL_LB_TYPE="${API_LOCAL_LB_TYPE:-nginx}"         # 本地代理实现: nginx | haproxy(开关 API_LOCAL_LB_ENABLED 在主文件)
KUBE_VIP_LOCAL_PROXY="${KUBE_VIP_LOCAL_PROXY:-false}"   # 本地代理兼容别名(并入 API_LOCAL_LB_ENABLED)

# (原「★ 在线部署开关」已于 2026-10-16 上移主文件 cluster.conf:
#   ONLINE_DEPLOY_CUBESTACK_OPERATOR → CUBESTACK_OPERATOR 区; ONLINE_DEPLOY_NVIDIA_GPU_OPERATOR → 附加组件开关区)

# ════════════════════════════════════════════════════════════
# §1 宿主机与集群基础(modules/01_env)
# ════════════════════════════════════════════════════════════

# ---------------- 1.1 宿主机 ----------------
HOST_PHYS_IP="${HOST_PHYS_IP:-}"                         # 宿主机物理 IP(留空=自动检测; SNAT 源)
# (虚拟机创建/网络变量在 tools/vm/vm-nodes.conf, load_config 自动加载)

# ---------------- 1.3 SSH ----------------
SSH_KEY_DIR="${SSH_KEY_DIR:-${HOME}/.ssh}"
SSH_KEY_NAME="${SSH_KEY_NAME:-cubestack_k8s}"
# (节点密码/用户见主文件 ①②; 节点独立密码写 NODES 第5字段)

# ---------------- 1.6 API 入口域名 ----------------
# 写入 kubespray apiserver_loadbalancer_domain_name + 证书 SAN, 并同步各节点 /etc/hosts
API_DOMAIN="${API_DOMAIN:-k8s-api.cubestack.io}"
# 域名解析地址(留空=自动: kube-vip 已绑→VIP, 否则→第一个 master; 显式设置强制用该地址)
API_ENTRY_IP="${API_ENTRY_IP:-}"

# ---------------- 1.7 Harbor(集群外仓库; 预留) ----------------
# 当前统一用【集群内 registry】(§3.2); HARBOR_DOMAIN 为未来外部 Harbor 模块(04_harbor 占位)预留
HARBOR_DOMAIN="${HARBOR_DOMAIN:-harbor.local}"

# ════════════════════════════════════════════════════════════
# §2 kubespray 基座(modules/02_k8s + kubespray addon)
# ════════════════════════════════════════════════════════════

# ---------------- 2.1 部署路径 / 离线目录 ----------------
# (${CLUSTER_NAME} 由 lib-common 解析; 默认 cubestack-cluster)
KUBESPRAY_INV_DIR="${KUBESPRAY_INV_DIR:-${REPO_ROOT}/deployments/kubespray/inventory/${CLUSTER_NAME}}"
KUBESPRAY_DIR="${KUBESPRAY_DIR:-${REPO_ROOT}/deployments/kubespray/kubespray}"
# 离线文件真根(offline-files/<组件>/…; kubespray 资产按版本分层, 见 KUBESPRAY_VERSION)
OFFLINE_FILES_ROOT="${OFFLINE_FILES_ROOT:-}"
# k8s 资产目录(kubespray 的 local_release_dir; 留空=lib-common 按版本派生)
OFFLINE_FILES_DIR="${OFFLINE_FILES_DIR:-}"
LOCAL_REPO_DIR="${LOCAL_REPO_DIR:-}"

# ---------------- 2.1b MinIO(可选; 离线文件下载/上传) ----------------
# fetch-offline-from-minio.sh 只读独立 config/minio.conf(模板 minio.conf.example)或 MINIO_* 环境变量;
#   sync-to-minio.sh / fetch-offline-files.sh 读本文件。已有 mc alias 时可全部留空。
MINIO_ALIAS="${MINIO_ALIAS:-minio}"                  # mc alias 名
MINIO_ENDPOINT="${MINIO_ENDPOINT:-}"                 # MinIO 服务地址(如 https://minio.example.com)
MINIO_ACCESS_KEY="${MINIO_ACCESS_KEY:-}"             # AccessKey
MINIO_SECRET_KEY="${MINIO_SECRET_KEY:-}"             # SecretKey
MINIO_BUCKET="${MINIO_BUCKET:-cubestack-installer}"  # 离线文件桶
MINIO_REMOTE_DIR="${MINIO_REMOTE_DIR:-offline-files}"  # 桶内目录(留空=sync 取本地源同名 / fetch 默认 offline-files)

# ---------------- 2.2 NTP 时间同步(k8s 部署前; 开关 NTP_ENABLED 在主文件) ----------------
# 权威 = 第一个 master(首 master 装 chrony 服务端, local stratum 10 离线兜底 + 可选 NTP_UPSTREAM);
#   显式 NTP_SERVER 可覆盖。应用时对偏差>1s 的节点硬对齐; 校验偏差 ≤ NTP_MAX_OFFSET_MS 否则中止部署;
#   节点→权威 IP 通路预检(ping 不通即明确报错, 不再伪装成"偏差超限")。
NTP_SERVER="${NTP_SERVER:-}"                          # 权威时间源 IP; 留空=第一个 master 为权威
NTP_UPSTREAM="${NTP_UPSTREAM:-}"                      # 权威(首 master)的公网上游(如 "pool ntp.aliyun.com iburst"); 留空=离线用本机时钟
NTP_ALLOW="${NTP_ALLOW:-}"                            # chrony server allow 子网(默认空=仅本机; 多子网填 "10.66.1.0/24" 等)
NTP_MAX_OFFSET_MS="${NTP_MAX_OFFSET_MS:-2000}"        # 节点-权威最大时钟偏差(毫秒); 超限本步失败 → 中止部署
NTP_REACH_CHECK="${NTP_REACH_CHECK:-1}"               # 节点→权威 IP 通路预检(1=开); 仅禁 ICMP 环境置 0

# ---------------- 2.3 集群内部网络 CIDR(由 sync 写入 kubespray group_vars) ----------------
KUBE_SERVICE_ADDRESSES="${KUBE_SERVICE_ADDRESSES:-10.233.0.0/18}"
KUBE_PODS_SUBNET="${KUBE_PODS_SUBNET:-10.233.64.0/18}"
NODELOCAL_DNS_IP="${NODELOCAL_DNS_IP:-169.254.25.10}"
# nodelocaldns 外部上游。本环境无外部 DNS ⇒ 默认 127.0.0.1(查询失败但防回环; 留空会让 kubespray
#   渲染 forward 到 /etc/resolv.conf 形成回环 → coredns FATAL)。接入真实 DNS 时改实际地址后重跑 sync。
UPSTREAM_DNS_SERVERS="${UPSTREAM_DNS_SERVERS:-127.0.0.1}"

# ---------------- 2.4 CNI(calico + IPIP, 唯一方案) ----------------
# 本环境 fabric(proxy-ARP/按 IP 转发)只转发节点 IP、丢弃 UDP 4789 ⇒ 唯一可用 = Calico + IPIP;
#   sync 固定写: backend=bird + ipip=Always + vxlan=Never + mtu=1480。
KUBE_NETWORK_PLUGIN="${KUBE_NETWORK_PLUGIN:-calico}"

# ---------------- 2.6 containerd(版本 + 设备属主) ----------------
CONTAINERD_CONFIG_VERSION="${CONTAINERD_CONFIG_VERSION:-3}"  # 只接受 3|4; 默认 3(沐曦 container-runtime 只支持 ≤3; 留空按 3, 静默回落 4 会让沐曦组件 CrashLoop)
# 设备属主(非 root 容器访问 MetaX GPU 的节点前置): true → 容器创建时按 runAsUser 对设备节点 chown
#   (不设的后果: /dev/mxcd 属主 root:root 0600 → runAsUser:1000 open() EACCES, 且表面无任何报错)。
#   sync 写入 containerd_extra_runtime_args(新节点天然带上); 存量节点由 gpu_operator 每轮工具兜底;
#   ⚠ 生效需重建工作负载; 厂商安装器可能重写 config.toml(每轮重跑兜底)。
CONTAINERD_DEVICE_OWNERSHIP="${CONTAINERD_DEVICE_OWNERSHIP:-true}"

# ---------------- 2.7 宿主机 /etc/hosts 更新开关 ----------------
UPDATE_ETC_HOSTS="${UPDATE_ETC_HOSTS:-0}"             # 1 = 部署时更新宿主机 /etc/hosts 节点解析

# ════════════════════════════════════════════════════════════
# §3 集群基础设施(addon 基座)
# ════════════════════════════════════════════════════════════

# ---------------- 3.1 MetalLB(地址池 METALLB_POOL 在主文件必改项) ----------------
# ⚠ Layer2 要求: 池内 IP 与节点同二层且**空闲**; DHCP 管理网段须先把池加入排除段(否则地址被重复分配);
#   多集群共用网段时各用不同段; 网络若开 DHCP Snooping/IP Source Guard 需在 speaker 端口放开。
# (裸金属纯 L2 直连无需 bridge; 依赖 kube_proxy_strict_arp=true, 已默认开启)

# ---------------- 3.2 集群内 Registry(kubespray addon; 开关 REGISTRY_ENABLED 在主文件) ----------------
# 所有 operator 的镜像都推到这里、节点按域名拉取(阶段四的隐含依赖); 外部 Harbor 见 §1.7。
REGISTRY_DOMAIN="${REGISTRY_DOMAIN:-registry.cubestack.io}"   # 内部域名(需本地 /etc/hosts 解析)
# REGISTRY_IP 留空 = 自动派生(nodeport 模式=首个 master; metallb=池内首地址);
#   ⚠ 多集群共用网段时必须显式指定不冲突地址(否则推/拉打到别的集群 → 节点 pull NotFound)
REGISTRY_IP="${REGISTRY_IP:-}"
REGISTRY_PORT="${REGISTRY_PORT:-5000}"
# Service 暴露方式(留空 = 随 SERVICE_EXPOSE_MODE): loadbalancer | nodeport | clusterip
REGISTRY_SERVICE_TYPE="${REGISTRY_SERVICE_TYPE:-}"
REGISTRY_NODEPORT="${REGISTRY_NODEPORT:-31148}"        # nodeport 模式: 固定 NodePort(30000-32767)
REGISTRY_EXPOSE_HOST="${REGISTRY_EXPOSE_HOST:-0}"      # 1 = 宿主机 DNAT 5000→nodeport(供集群外 push)
# registry PVC 容量(写入 addons.yml)。⚠ 盘满会让**所有** push 500("no space left"); 200Gi 覆盖
#   dev_lab(≈21G)+metax(≈8G)+其余 addon 与滚动更新冗余; ceph-block 精简置备, 存量 PVC 自动幂等扩容
REGISTRY_DISK_SIZE="${REGISTRY_DISK_SIZE:-200Gi}"
# ── 大镜像 push 加速(dev_lab / model_images; 详见 docs/image-push-optimization.md) ──
# 现状: 源 docker-archive 层未压缩, skopeo push 会重新 gzip; 主要杠杆 = 层/镜像并行 + 跳过已有层。
# ⚠ skopeo 1.16.1 的 --dest-compress-level/--dest-compress-format 在 docker:// 推送中不生效。
IMAGE_PUSH_PARALLEL_LAYERS="${IMAGE_PUSH_PARALLEL_LAYERS:-4}"      # 单镜像内并发层数(1=串行)
IMAGE_PUSH_PARALLEL_IMAGES="${IMAGE_PUSH_PARALLEL_IMAGES:-2}"      # 同时推送镜像数(先推首个 base, 其余并行)
IMAGE_PUSH_PRECOMPUTE_DIGESTS="${IMAGE_PUSH_PRECOMPUTE_DIGESTS:-true}"  # 跳过 registry 已有层(--dest-precompute-digests)
IMAGE_PUSH_RETRY_TIMES="${IMAGE_PUSH_RETRY_TIMES:-5}"              # skopeo 内部重试次数(大 blob; 0=不传)

# ---------------- 3.3 镜像统一镜像源(Harbor mirrors) ----------------
# 上游(docker.io/quay.io/registry.k8s.io/ghcr.io…)─CI─▶ harbor.isuanova.com/mirrors/** ─▶ 离线 tar ─▶ 内置 registry
# 清单唯一数据源 = deployments/config/images.manifest(同步/取 tar/校验: tools/images/harbor-*.sh; 详见 docs/harbor-mirror.md)
HARBOR_MIRROR_ENABLED="${HARBOR_MIRROR_ENABLED:-true}"        # true=save/load 工具优先从 Harbor 拉镜像; false=直连上游
HARBOR_MIRROR_REGISTRY="${HARBOR_MIRROR_REGISTRY:-harbor.isuanova.com}"   # Harbor 域名(与 metax 同源)
HARBOR_MIRROR_PROJECT="${HARBOR_MIRROR_PROJECT:-mirrors}"     # 镜像专用项目(不存在时由同步工具自动创建)
# 路径规则: mirrors/<上游注册域>/<仓库路径>:<tag>(凭据 HARBOR_MIRROR_USER/PASSWORD 在主文件 ④)
HARBOR_MIRROR_INSECURE="${HARBOR_MIRROR_INSECURE:-false}"     # true=跳过 TLS 校验(自签证书时用)
IMAGE_MANIFEST="${IMAGE_MANIFEST:-${REPO_ROOT}/deployments/config/images.manifest}"   # 镜像清单路径

# ════════════════════════════════════════════════════════════
# §4 组件细节(按组件成组; 开关均在主文件)
# ════════════════════════════════════════════════════════════

# ---------------- 4.1 沐曦 GPU Operator ----------------
# 升级只改 METAX_VERSION(路径/镜像由本配置派生); 资源包来源: 沐曦软件中心 metax-gpu-k8s(<版本>.tar.gz)
METAX_VERSION="${METAX_VERSION:-0.15.3}"                        # GPU Operator 版本(决定包名/镜像 tag/Chart)
METAX_OFFLINE_DIR="${METAX_OFFLINE_DIR:-${REPO_ROOT}/deployments/offline-files/metax-gpu}"   # 镜像 tar + 资源包/驱动包目录
METAX_PKG_DIR="${METAX_PKG_DIR:-${METAX_OFFLINE_DIR}}"          # 大文件(资源包 tgz / *.run)目录
METAX_PKG_TGZ="${METAX_PKG_TGZ:-metax-gpu-k8s-package.${METAX_VERSION}.tar.gz}"  # 资源包文件名
METAX_CHART_DIR="${METAX_CHART_DIR:-${REPO_ROOT}/deployments/cubestack-addon/metax-gpu-operator/metax-operator}"  # 修复版 chart(3 处官方 bug 已修)
METAX_IMAGE_MODE="${METAX_IMAGE_MODE:-tar}"                     # tar=离线 tar 加载 | run=从 metax-k8s-images.<ver>.run 直推
METAX_IMAGE_DIR="${METAX_IMAGE_DIR:-${LOCAL_REPO_DIR}/images}"  # tar 模式: 额外镜像 tar 目录(优先 METAX_OFFLINE_DIR)
METAX_TAR_PATTERN="${METAX_TAR_PATTERN:-metax}"                 # tar 模式: 文件名匹配
METAX_SAVE_PATTERN="${METAX_SAVE_PATTERN:-^harbor\.isuanova\.com/metax/}"  # save 工具枚举的仓库前缀(可选 ^cr\.metax-tech\.com/cloud/)
METAX_HARBOR="${METAX_HARBOR:-harbor.isuanova.com}"             # 沐曦镜像上游 Harbor(不发布公共 registry)
METAX_PROJECT="${METAX_PROJECT:-metax}"                         # 沐曦镜像上游项目
METAX_SAVE_EXCLUDE="${METAX_SAVE_EXCLUDE:-sglang}"              # save 工具跳过(正则; 大推理镜像)
METAX_IMAGE_COMPONENTS="${METAX_IMAGE_COMPONENTS:-gpu-label gpu-device gpu-aware topo-master topo-worker operator-controller container-runtime driver-manager gpu-scheduler}"   # 核心组件(与版本配套; METAX_LIST_IMAGES=true 打印保存命令)
METAX_REGISTRY="${METAX_REGISTRY:-${REGISTRY_DOMAIN}:${REGISTRY_PORT}/metax}"  # 内置 registry 仓库路径
METAX_NAMESPACE="${METAX_NAMESPACE:-metax-operator}"            # 部署命名空间
METAX_RELEASE_NAME="${METAX_RELEASE_NAME:-metax-gpu-operator}"  # Helm release 名
METAX_CLUSTER_TYPE="${METAX_CLUSTER_TYPE:-k8s}"                 # 集群类型: k8s|k3s
METAX_DRIVER_DEPLOY_POLICY="${METAX_DRIVER_DEPLOY_POLICY:-PreferHost}"  # PreferHost=用节点已装驱动(默认); PreferCloud=容器化装驱动(可能 CrashLoop)
METAX_DRIVER_VERSION="${METAX_DRIVER_VERSION:-3.8.1.6-amd64}"   # driver-image 版本(需与离线 tar 匹配)
METAX_MACA_IMAGE="${METAX_MACA_IMAGE:-maca:3.8.1.2-ubuntu22.04-amd64}"  # MXMACA SDK 镜像(需与离线 tar 匹配)

# ---------------- 4.3b Rook/Ceph(详见 docs/ceph-rook.md; 模式开关 CEPH_MODE 与凭据在主文件) ----------------
# 两种模式【二选一, 勿同时配置两套连接参数】:
#   internal(默认) = 集群内部署 Rook-Ceph(CephCluster + 本地 OSD 裸盘; 参数见下"internal 段")
#   external       = 仅接入外部已有 Ceph(不建 CephCluster/不碰本地盘; [必填] CEPH_MONITORS/USER/KEYRING, 见下"external 段")
#   ⚠ 旧变量 CEPH_EXTERNAL_MONITORS/POOL/USER/KEYRING 自动兼容(load_config 归一化)

# ── internal 模式(集群内部署) ──
# 存储节点选择(lib-common ceph_storage_hosts): ① CEPH_NODES 显式优先; ② 否则按 CEPH_NODE_ROLE 从 NODES 选(默认 master)。
#   ⚠ mon 需 3 台法定: 存储节点 < CEPH_MIN_NODES(3) 时**不创建 CephCluster**(registry 回退 local-path);
#     master 少于 3 台的集群需显式 CEPH_NODES(把 worker 也算上)。
CEPH_NODES="${CEPH_NODES:-}"                      # 显式指定存储节点(hostname 逗号分隔); 非空优先级最高
CEPH_NODE_ROLE="${CEPH_NODE_ROLE:-master}"        # 未显式指定时按角色选: master(默认)/ worker / all
CEPH_NODE_LABEL="${CEPH_NODE_LABEL:-ceph-storage=rook-ceph}"   # 存储节点 label(模块自动打标)
CEPH_NAMESPACE="${CEPH_NAMESPACE:-rook-ceph}"     # Rook/Ceph 命名空间
CEPH_VERSION="${CEPH_VERSION:-v20.2.2}"           # Ceph 守护进程镜像 tag
ROOK_VERSION="${ROOK_VERSION:-v1.20.2}"           # Rook operator 版本(manifest 目录名+镜像 tag)
CEPHCSI_VERSION="${CEPHCSI_VERSION:-v3.17.0}"     # cephcsi 驱动镜像 tag
CEPH_CSI_OPERATOR_VERSION="${CEPH_CSI_OPERATOR_VERSION:-v1.0.4}"  # ceph-csi-operator(rook v1.20 必须)
# 裸盘(OSD)策略: auto=自动检测未使用裸盘(推荐); explicit=在 CEPH_DATA_DISKS 手工指定
CEPH_DATA_DISK_POLICY="${CEPH_DATA_DISK_POLICY:-auto}"
CEPH_DATA_DISKS="${CEPH_DATA_DISKS:-}"            # explicit 策略: "节点:/dev/vdb,/dev/vdc;节点2:/dev/vdb"
CEPH_DETECT_EXCLUDE="${CEPH_DETECT_EXCLUDE:-^(sda|sr0|vda|nbd[0-9]+)$}"   # 自动检测排除的盘名(正则, 防误选系统盘)
CEPH_MON_COUNT="${CEPH_MON_COUNT:-3}"             # mon 数量(奇数)
CEPH_MGR_COUNT="${CEPH_MGR_COUNT:-2}"             # mgr 数量(2=active+standby)
# hostNetwork: mon/osd/mgr 直接监听节点 IP(不占 pod 网段)。历史: pod 网络下外部 mon msgr 握手会被
#   CNI fabric 损坏 → 外部接入不可用; false 恢复 pod 网络 + NodePort(外部 msgr 可能不工作)。
CEPH_HOST_NETWORK="${CEPH_HOST_NETWORK:-true}"
# 对外暴露方式(仅 internal): host-network(默认, 节点 IP + 原生 6789/3300, 绕开 kube-proxy) | nodeport | metallb
CEPH_EXPOSE_MODE="${CEPH_EXPOSE_MODE:-host-network}"
CEPH_POOL_REPLICAS="${CEPH_POOL_REPLICAS:-3}"     # 副本数
CEPH_POOL_MIN_SIZE="${CEPH_POOL_MIN_SIZE:-2}"     # min_size(1 台主机宕机池仍可写)
CEPH_OSD_MEMORY_TARGET="${CEPH_OSD_MEMORY_TARGET:-12}"   # 每 OSD 内存目标(GiB)
CEPHFS_ENABLED="${CEPHFS_ENABLED:-true}"         # 可选: 启用 CephFS(RWX 共享文件)
CEPH_RGW_ENABLED="${CEPH_RGW_ENABLED:-true}"     # 可选: 启用 RGW/S3 对象存储
# ── CephFS 宿主机共享挂载(cephfs_mount 模块; 默认随 CEPHFS_ENABLED 启用) ──
# 把 CephFS 内的 <SUBDIR> 目录挂到**每台节点**的 <PATH>, 供宿主机进程/容器共享模型等大文件。
# 实现: DaemonSet(cephcsi 镜像自带 mount.ceph) + hostPath mountPropagation=Bidirectional,
#       节点无需安装 ceph-common; 节点重启由 DaemonSet 自动重挂。详见 docs/ceph-rook.md。
CEPHFS_MOUNT_ENABLED="${CEPHFS_MOUNT_ENABLED:-${CEPHFS_ENABLED}}"   # 总开关(默认跟随 CEPHFS_ENABLED)
CEPHFS_MOUNT_PATH="${CEPHFS_MOUNT_PATH:-/mnt/cephfs/models}"        # 宿主机挂载点(仅允许安全字符)
CEPHFS_MOUNT_SUBDIR="${CEPHFS_MOUNT_SUBDIR:-models}"                # CephFS 内子目录(不存在则自动创建)
CEPHFS_MOUNT_DIR_MODE="${CEPHFS_MOUNT_DIR_MODE:-0777}"              # 子目录权限(共享模型目录默认放开写)
CEPHFS_MOUNT_USER="${CEPHFS_MOUNT_USER:-cubestack-cephfs-models}"   # internal 专用 cephx 用户
CEPHFS_MOUNT_IMAGE="${CEPHFS_MOUNT_IMAGE:-}"                        # 空=自动取 cephfs CSI nodeplugin 镜像

# ── internal 的"对外暴露"(供其它集群以 CEPH_MODE=external 接入; 接入方勿设本段) ──
# ceph_csi 模块自动完成: 网络层(mon/RGW *-external Service) + 资源层(外部 pool/CephFS) + 认证层(专用用户)
#   + 导出 config/external-ceph-self-define-access.conf(拷贝到目标集群即可接入)。自检: --steps verify_ceph
CEPH_EXTERNAL_EXPOSE="${CEPH_EXTERNAL_EXPOSE:-true}"          # 总开关: internal 集群默认对外暴露
CEPH_EXTERNAL_EXPOSE_MODE="${CEPH_EXTERNAL_EXPOSE_MODE:-}"    # 覆盖暴露模式(nodeport/loadbalancer/metallb/clusterip; 空=随 SERVICE_EXPOSE_MODE)
CEPH_EXTERNAL_USER="${CEPH_EXTERNAL_USER:-cubestack-ext-rbd}" # 外部 RBD 专用用户(profile rbd, 非 admin)
CEPH_EXTERNAL_RBD_POOL="${CEPH_EXTERNAL_RBD_POOL:-cubestack-ext-rbd-pool}"  # 外部专用 RBD pool
CEPH_EXTERNAL_RBD_PG="${CEPH_EXTERNAL_RBD_PG:-32}"            # 外部 RBD pool PG 数
CEPH_EXTERNAL_CEPHFS="${CEPH_EXTERNAL_CEPHFS:-}"              # 空=随 CEPHFS_ENABLED
CEPH_EXTERNAL_CEPHFS_USER="${CEPH_EXTERNAL_CEPHFS_USER:-cubestack-ext-cephfs}"  # CephFS provisioner 角色用户
CEPH_EXTERNAL_CEPHFS_NODE_USER="${CEPH_EXTERNAL_CEPHFS_NODE_USER:-cubestack-ext-cephfs-node}"  # CephFS node 角色用户(挂载 fs)
CEPH_EXTERNAL_CEPHFS_FS="${CEPH_EXTERNAL_CEPHFS_FS:-cubestack-ext-fs}"         # 外部 CephFilesystem 名
CEPH_EXTERNAL_CEPHFS_META_POOL="${CEPH_EXTERNAL_CEPHFS_META_POOL:-cubestack-ext-cephfs-metadata}"  # (预留)meta 池名; ⚠ 实际名由 Rook 自动生成 <fs>-metadata
CEPH_EXTERNAL_CEPHFS_DATA_POOL="${CEPH_EXTERNAL_CEPHFS_DATA_POOL:-cubestack-ext-cephfs-data}"       # dataPools.name 输入(短名); ⚠ 实际池名 = <fs>-<本变量>
CEPH_EXTERNAL_CEPHFS_META_PG="${CEPH_EXTERNAL_CEPHFS_META_PG:-16}"   # meta pool PG 数
CEPH_EXTERNAL_CEPHFS_DATA_PG="${CEPH_EXTERNAL_CEPHFS_DATA_PG:-32}"   # data pool PG 数
CEPH_EXTERNAL_CONF="${CEPH_EXTERNAL_CONF:-}"                  # 导出文件路径(空=config/external-ceph-self-define-access.conf)
CEPH_RGW_EXPOSE_MODE="${CEPH_RGW_EXPOSE_MODE:-}"              # RGW 独立覆盖(仅影响 RGW; clusterip=不对外)
CEPH_RGW_NODEPORT="${CEPH_RGW_NODEPORT:-}"                    # RGW NodePort(留空=自动分配)
# 规律 NodePort(可选; mon 按 mon_list 顺序 base→base+1→…; 默认 30100 → 30100/30101/30102)
CEPH_MON_NODEPORT_BASE="${CEPH_MON_NODEPORT_BASE:-30100}"
CEPH_MON_NODEPORT_MAX="${CEPH_MON_NODEPORT_MAX:-32767}"       # 硬上限(须 ≤ apiserver service-node-port-range)

# ── external 模式(接入外部 Ceph; 本集群不建 CephCluster) ──
# [必填 4 项] CEPH_MONITORS / CEPH_USER / CEPH_KEYRING(模式开关 CEPH_MODE 在主文件)
# [可选] CEPH_POOL(外部 RBD pool)、CEPH_EXTERNAL_CEPHFS_*(外部 CephFS)
# ★ 官方导入路径(推荐): CEPH_EXTERNAL_ENV_FILE 指向提供方导出的 external-ceph.env; 留空自动探测
#   deployments/config/external-ceph.env(存在即走官方路径: 建 secret/CM → ceph_csi → 官方 SC 集合 → 接 RGW)
CEPH_MIN_NODES="${CEPH_MIN_NODES:-3}"            # internal: 存储节点 < 此值 → 不创建集群内 CephCluster
CEPH_EXTERNAL_ENV_FILE="${CEPH_EXTERNAL_ENV_FILE:-}"  # external 官方导入: external-ceph.env 路径(空=自动探测默认目录)
CEPH_ENV_CONFIRM_SLEEP="${CEPH_ENV_CONFIRM_SLEEP:-60}"  # external: 红底核对外部连接参数的倒计时秒数(CI 设 0)
CEPH_MONITORS="${CEPH_MONITORS:-}"               # external: 外部 mon 地址, 如 "10.66.1.21:6789,10.66.1.22:6789"; 留空=不启用
CEPH_POOL="${CEPH_POOL:-rbd}"                    # external: 外部 RBD pool 名
CEPH_USER="${CEPH_USER:-admin}"                  # external: 认证用户(默认 admin)
CEPH_KEYRING="${CEPH_KEYRING:-}"                 # external: 认证 keyring(必填, 如 AQCxxx==)
CEPH_RBD_NODE_USER="${CEPH_RBD_NODE_USER:-}"     # external(可选): csi-rbd node 角色独立用户(留空=回退 CEPH_USER; 与 KEYRING 成对)
CEPH_RBD_NODE_KEYRING="${CEPH_RBD_NODE_KEYRING:-}"  # external(可选): 上述 node 用户 keyring(留空=回退 CEPH_KEYRING)
CEPH_EXTERNAL_PROVISION_SMOKE="${CEPH_EXTERNAL_PROVISION_SMOKE:-false}"  # external: provision 冒烟(真建 1Gi 卷写读; 默认关)
CEPH_DASHBOARD_ENABLED="${CEPH_DASHBOARD_ENABLED:-true}"  # Ceph Dashboard

# ── 【示例】external 接入连接参数(全为注释模板, 不会生效; 防与上方真实变量重复声明) ──
# 用法: 取消注释并填实际值 → 主文件 CEPH_MODE 改 external → ./deploy-cluster.sh --steps ceph_csi
#   ⚠ 真实 key 不要写进仓库文件(会进 git)
# CEPH_MONITORS="10.244.1.201:6789,10.244.1.202:6789,10.244.1.203:6789"
# CEPH_POOL="cubestack-ext-rbd-pool"
# CEPH_USER="cubestack-ext-rbd"
# CEPH_KEYRING="<占位: 如 AQxxx==>"
# CEPHFS_FS="cubestack-ext-fs"
# CEPHFS_META_POOL="cubestack-ext-fs-metadata"                        # ⚠ 真实池名 = <fs>-metadata
# CEPHFS_DATA_POOL="cubestack-ext-fs-cubestack-ext-cephfs-data"       # ⚠ 真实池名 = <fs>-<dataPoolName>
# CEPHFS_USER="cubestack-ext-cephfs"
# CEPHFS_KEYRING="<占位: 如 AQA///==>"
# CEPHFS_NODE_USER="cubestack-ext-cephfs-node"
# CEPHFS_NODE_KEYRING="<占位: 如 AQA///==>"
# CEPH_RGW_EXTERNAL_ENDPOINT="10.244.1.204:80"

# ── Ceph 备份/恢复(独立运维模块, 不随部署执行; 见 docs/ceph-backup-restore.md) ──
# sudo ./deploy-cluster.sh --steps ceph_backup                      # save(CR+secret+mon store → master 根盘)
# CEPH_BACKUP_ACTION=restore sudo ./deploy-cluster.sh --steps ceph_backup   # 整 ns 重建后恢复(认领旧 OSD 数据)
CEPH_BACKUP_ACTION="${CEPH_BACKUP_ACTION:-save}"           # save | restore | fetch-fsid | install-cron | run-cron
CEPH_BACKUP_DIR="${CEPH_BACKUP_DIR:-/var/lib/ceph/backup}" # master 根盘备份目录
CEPH_BACKUP_RETENTION="${CEPH_BACKUP_RETENTION:-10}"       # 时间戳备份保留份数
# 安全确认: CEPH_ENABLED=true 部署时红底列出将用的节点与裸盘并 sleep CEPH_CONFIRM_SLEEP 秒
CEPH_CONFIRM_SLEEP="${CEPH_CONFIRM_SLEEP:-60}"
# 离线文件: ceph 镜像 tar(独立脚本 tools/images/ceph-save-images.sh 下载)
CEPH_IMAGE_DIR="${CEPH_IMAGE_DIR:-${REPO_ROOT}/deployments/offline-files/kubespray/images}"
CEPH_ROOK_MANIFEST_DIR="${CEPH_ROOK_MANIFEST_DIR:-${REPO_ROOT}/deployments/cubestack-addon/rook}"
# registry 后端存储: 默认随 Ceph(CEPH_ENABLED+CEPH_CSI_ENABLED 都开 → ceph-block; 否则 local-path)。
#   ⚠ Ceph 模式下集群无 local-path SC, 固定写 local-path 会让 registry PVC 永远 Pending; 显式赋值可强制覆盖
if [ -z "${REGISTRY_STORAGE_CLASS:-}" ]; then
    if [ "${CEPH_ENABLED:-false}" = "true" ] && [ "${CEPH_CSI_ENABLED:-false}" = "true" ]; then
        REGISTRY_STORAGE_CLASS="ceph-block"
    else
        REGISTRY_STORAGE_CLASS="local-path"
    fi
fi

# ---------------- 4.6b CubeStack 平台 Operator(自研; 详见 docs/cubestack-operator.md) ----------------
# 部署: 全量自动带上 / --steps cubestack_operator; 验证 --steps verify_cubestack_operator。
# chart 来源: 私有 OCI(suanova-private, 需凭据); 离线副本随离线包分发, 默认平铺在
#   offline-files/cubestack-operator/ 顶层(与组件镜像 tar 同目录); 旧 cubestack-addon/ 路径仅作过渡 fallback。
CUBESTACK_OPERATOR_NAMESPACE="${CUBESTACK_OPERATOR_NAMESPACE:-cubestack-system}"   # 部署命名空间
CUBESTACK_OPERATOR_RELEASE="${CUBESTACK_OPERATOR_RELEASE:-cubestack-operator}"     # Helm release 名
CUBESTACK_OPERATOR_CHART_REF="${CUBESTACK_OPERATOR_CHART_REF:-oci://harbor.isuanova.com/suanova-private/cubestack-operator-chart}"
CUBESTACK_OPERATOR_CHART_VERSION="${CUBESTACK_OPERATOR_CHART_VERSION:-1.0.0-latest}"  # 滚动版本(与镜像 :latest 配套)
# chart 同步模式: auto(默认; Harbor 可达→online 比 digest, 不可达→offline) | online(拉取失败降级回退本地) | offline(完全离线)
CUBESTACK_OPERATOR_CHART_SYNC="${CUBESTACK_OPERATOR_CHART_SYNC:-auto}"
CUBESTACK_OPERATOR_IMAGE_TAG="${CUBESTACK_OPERATOR_IMAGE_TAG:-latest}"            # 镜像 tag(渲染/安装两处生效; 2026-10-19)
# 镜像源优先级: auto(默认; Harbor→离线 tar→本地 docker) | harbor|tar|docker(只用指定源)
CUBESTACK_OPERATOR_IMAGE_SOURCE="${CUBESTACK_OPERATOR_IMAGE_SOURCE:-auto}"
# 拉取策略: 2026-10-19 用户口径 —— 离线/在线都**恒 Always**(离线镜像已推入集群 registry, 在线从 Harbor,
#   每次新建 Pod 都必须重新解析 tag)。本变量保留兼容, 当前设置任何值都不会改变 Always 行为。
CUBESTACK_OPERATOR_IMAGE_PULL_POLICY="${CUBESTACK_OPERATOR_IMAGE_PULL_POLICY:-Always}"
# 把 operator 镜像 digest 写进 podAnnotations(离线/在线都启用; digest 变才触发滚动)。默认开, 极少需要关
CUBESTACK_OPERATOR_PIN_IMAGE_DIGEST="${CUBESTACK_OPERATOR_PIN_IMAGE_DIGEST:-true}"
CUBESTACK_OPERATOR_OFFLINE_DIR="${CUBESTACK_OPERATOR_OFFLINE_DIR:-${REPO_ROOT}/deployments/offline-files/cubestack-operator}"  # 离线 tar + chart 目录(harbor-save-images.sh / platform-sync.sh 维护)
# chart 目录显式覆盖(最高优先级; 留空=用 OFFLINE_DIR 顶层; 指定后缺失即失败, 不回退)
CUBESTACK_OPERATOR_CHART_DIR="${CUBESTACK_OPERATOR_CHART_DIR:-}"
CUBESTACK_OPERATOR_HARBOR_HOST="${CUBESTACK_OPERATOR_HARBOR_HOST:-harbor.isuanova.com}"  # 私有项目凭据复用 HARBOR_MIRROR_USER/PASSWORD(见主文件 ④); 2FA 用「CLI Secret」
# 平台实例 CR(clusterCR.enabled): 打开会一并下发平台组件镜像(lws/envoy-gateway/prometheus…),
#   那些不在本模块离线范围内(需另行备齐, 见 docs/cubestack-operator.md); 自定义 spec 用 CR_VALUES_FILE(-f)
CUBESTACK_OPERATOR_CR_VALUES_FILE="${CUBESTACK_OPERATOR_CR_VALUES_FILE:-}"
# 模型 bundles 开关(2026-10-20 用户口径): 默认 true = **保留 chart 默认的 8 个 bundle + modelBundles
#   开启**(单步 --steps cubestack_operator 与全量部署一致); false = 清空 spec.bundles 并关闭
#   modelBundles(只装平台服务, 不装推理目录)。仅接受 true|false(其他值报配置错误)。
#   需要自定义 bundle 列表时保持 true, 用 CR_VALUES_FILE 覆盖。
CUBESTACK_OPERATOR_MODEL_BUNDLES_ENABLED="${CUBESTACK_OPERATOR_MODEL_BUNDLES_ENABLED:-true}"
# RWO 单卷组件守护(2026-10-19): operator 异步创建组件 Deployment, 部署后等待该秒数再把
#   引用 ReadWriteOnce PVC 的 Deployment 改成 strategy=Recreate(防新 Pod 先起导致 Multi-Attach)。
#   0=不等待; 组件不存在时最多等这么久(默认 60s)。
CUBESTACK_OPERATOR_RWO_STRATEGY_WAIT_SECONDS="${CUBESTACK_OPERATOR_RWO_STRATEGY_WAIT_SECONDS:-60}"

# ---------------- 4.7 Multus CNI(详见 cubestack-addon/multus/CUBESTACK.md) ----------------
