# ---------------- 4.8 RDMA 共享设备插件(详见 cubestack-addon/rdma/CUBESTACK.md) ----------------
# 离线镜像: tools/images/rdma-save-images.sh 下载 ghcr.io/mellanox/k8s-rdma-shared-dev-plugin → offline-files/rdma/
RDMA_SAVE_DIR="${RDMA_SAVE_DIR:-${REPO_ROOT}/deployments/offline-files/rdma}"
RDMA_IMAGE_TAG="${RDMA_IMAGE_TAG:-v1.5.4}"              # ⚠ 源在 ghcr.io/mellanox; 1.4.0 无 v 前缀; 模块按 tar 内实际 tag 自适应
# 资源模式: by-link(默认; IB/RoCE 两个资源池, 与真实 GPU 集群一致) | per-hca(每卡独立资源) | pool(全部聚合, 兼容旧部署)
#   ⚠ by-link/per-hca 检测到 0 块 HCA 会报错退出 —— 除非 RDMA_PLACEHOLDER_HCAS 非空(默认非空)
RDMA_HCA_MODE="${RDMA_HCA_MODE:-by-link}"
RDMA_IB_RESOURCE="${RDMA_IB_RESOURCE:-rdma/ib_shared_devices}"          # by-link: IB 池资源名; ⚠ 写错是静默故障(pod 永久 Pending)
RDMA_ROCE_RESOURCE="${RDMA_ROCE_RESOURCE:-rdma/roce_shared_devices}"  # by-link: RoCE 池资源名
RDMA_HCA_MAX="${RDMA_HCA_MAX:-100}"                     # 每资源最大共享 Pod 数(rdmaHcaMax)
RDMA_RESOURCE_PREFIX="${RDMA_RESOURCE_PREFIX:-nvidia.com}"  # 扩展资源前缀(pool 模式用)
RDMA_RESOURCE_NAME="${RDMA_RESOURCE_NAME:-mlx5_0}"      # 扩展资源名(pool 模式; by-link/per-hca 忽略)
RDMA_IF_NAMES="${RDMA_IF_NAMES:-}"                       # 宿主机 RDMA 网卡名(逗号分隔); ⚠ 留空=自动扫描全部节点采集
RDMA_ACTIVE_ONLY="${RDMA_ACTIVE_ONLY:-true}"             # 自动检测只收录 ACTIVE 链路(false=全部; 显式 IF_NAMES 时忽略)
# 纯 VM 无 RDMA 卡的占位设备名(默认 3 个): 自动检测 0 块 HCA 时按这些名字生成 config.json(不注册任何资源,
#   插件正常起来, verify 据此放行并标注"未验收真实 RDMA")。检测到真实 HCA 时本项被忽略。想恢复"无卡即报错": 本行改成 =""
RDMA_PLACEHOLDER_HCAS="${RDMA_PLACEHOLDER_HCAS:-mlx5_0,mlx5_1,mlx5_2}"
RDMA_VENDORS="${RDMA_VENDORS:-15b3}"                    # PCI Vendor ID(Mellanox/NVIDIA=15b3)
RDMA_UPDATE_INTERVAL="${RDMA_UPDATE_INTERVAL:-300}"     # periodicUpdateInterval 秒(0=关)
RDMA_NAMESPACE="${RDMA_NAMESPACE:-kube-system}"         # 插件命名空间

# ---------------- 4.8b 网络/RDMA 诊断 pod(netshoot; 详见 docs/netshoot.md) ----------------
# 常驻工具箱(tcpdump/ip/ss/mtr + rdma-core + perftest); 镜像由 tools/images/netshoot-rdma-build.sh 构建;
#   ⚠ 自建 tar 缺失时回退原始 netshoot(无 ibv_*/perftest, 会告警)。按需 --steps netshoot 部署(开关默认关)。
#   ⚠ 改镜像内容必须**换新 tag**(同 tag 会被 registry/节点缓存跳过):
#     sudo IMAGE_TAG=<perftest版本>-r<N> tools/images/netshoot-rdma-build.sh --force; 然后改下面 tag 重跑
NETSHOOT_ENABLED="${NETSHOOT_ENABLED:-false}"            # 网络/RDMA 诊断 pod
NETSHOOT_NAMESPACE="${NETSHOOT_NAMESPACE:-default}"      # 部署命名空间(默认 default)
NETSHOOT_POD_NAME="${NETSHOOT_POD_NAME:-cubestack-netshoot}"   # pod 固定名(便于 exec)
NETSHOOT_SAVE_DIR="${NETSHOOT_SAVE_DIR:-${REPO_ROOT}/deployments/offline-files/netshoot}"   # 自建镜像 tar 目录
NETSHOOT_RDMA_VERSION="${NETSHOOT_RDMA_VERSION:-26.04.17}"   # 自建镜像 tag(= 构建脚本 IMAGE_TAG; 也是 pod 拉的 tag)
NETSHOOT_RDMA_RESOURCE="${NETSHOOT_RDMA_RESOURCE:-}"     # pod 申请的 RDMA 资源(留空=跟随 RDMA_IB_RESOURCE; 未注册时自动不申请)
NETSHOOT_BASE_TAR="${NETSHOOT_BASE_TAR:-${REPO_ROOT}/deployments/offline-files/os/netshoot.tar}"   # 回退用原始 netshoot tar

# ---------------- 4.9 开发镜像(dev-lab; 模块 36_dev_lab 排在全部部署模块末位) ----------------
# cpu/maca/cuda 家族随部署推入集群内置 registry(≈21G 大推送排最后, 不阻塞关键链路; 开关 DEV_LAB_ENABLED 默认 true)
DEV_LAB_SAVE_DIR="${DEV_LAB_SAVE_DIR:-${REPO_ROOT}/deployments/offline-files/dev-lab}"
DEV_LAB_IMAGE_TAG="${DEV_LAB_IMAGE_TAG:-latest}"       # ⚠ 统一 tag(上游滚动构建, 模块按 digest 比对幂等)

# ---------------- 4.9b 模型推理镜像(model-collection; 模块 37_model_images 排最后) ----------------
# 镜像集 = offline-files/model-collection/image-list.tsv(单一事实源); 大件 ≈85G 建议 .tar.gz
MODEL_IMAGES_SAVE_DIR="${MODEL_IMAGES_SAVE_DIR:-${REPO_ROOT}/deployments/offline-files/model-collection}"

# ════════════════════════════════════════════════════════════
# §5 离线镜像预加载
# ════════════════════════════════════════════════════════════
# 仅同步"部署 kubespray 最小镜像集"到节点 containerd(避免全量 rsync); 格式: 空格分隔条目,
#   含 ".tar" 为精确文件名, 否则为包含匹配; 留空 = 全量同步。可在 inventory/<集群>/preload-images.conf 覆盖。
#   ⚠ 本行有"四处副本逐字节一致"护栏(cluster.conf / 本文件 / trim-offline-files.sh / cubestack-offline.sh, check-modules ⑭)
PRELOAD_IMAGE_PATTERNS="${PRELOAD_IMAGE_PATTERNS:-calico_cni calico_kube-controllers calico_node etcd kube-apiserver kube-controller-manager kube-proxy kube-scheduler coredns cluster-proportional-autoscaler k8s-dns-node-cache metrics-server pause local-volume-provisioner node-feature-discovery metallb kube-vip library_registry local-path-provisioner busybox library_nginx}"
