# CubeStack Ceph 外部接入配置(由 ceph-expose-external.sh 生成, 2026-09-20_201934)
# 用途: 拷贝到目标 K8s 集群的 cluster.conf, 设 CEPH_MODE=external 后由其 ceph-csi-operator 接入。
# 本机 5 层自检(含外部客户端协议级测试): bash deployments/scripts/tools/k8s/ceph-expose-external.sh status
CEPH_MODE="external"
CEPH_MONITORS="10.244.1.11:6789,10.244.1.13:6789,10.244.1.12:6789"
CEPH_FSID="a5ed6cbc-0363-4ef4-b1c1-aa83f166e966"
# --- RBD(ceph-csi RBD provisioner 使用) ---
CEPH_POOL="cubestack-ext-rbd-pool"
CEPH_USER="cubestack-ext-rbd"
CEPH_KEYRING="AQBRz69qWlYWJhAALj1ahN93zp+ntzDv2oJf4w=="
# --- CephFS(ceph-csi CephFS provisioner/node 分用户使用, 2026-09-10) ---
CEPHFS_FS="cubestack-ext-fs"
CEPHFS_META_POOL="cubestack-ext-fs-metadata"
CEPHFS_DATA_POOL="cubestack-ext-fs-cubestack-ext-cephfs-data"
# CephFS provisioner 角色(建删 subvolume; 提供方 caps 只给 meta 池 rw)
CEPHFS_USER="cubestack-ext-cephfs"
CEPHFS_KEYRING="AQBUz69qMEmeBhAARajZpF7F1EkSTM8JexZ4tA=="
# CephFS node 角色(挂载 fs 承载文件 I/O; 提供方给 meta+data 池 rw) —— 不设则消费者回退 CEPHFS_USER(旧行为)
CEPHFS_NODE_USER="cubestack-ext-cephfs-node"
CEPHFS_NODE_KEYRING="AQBWz69qa4/RHBAAJOgTUP5NLR/PEdR3OxMN3A=="
# --- RGW(S3, 供外部应用如 Model 仓库; csi-operator 不需要) ---
CEPH_RGW_EXTERNAL_ENDPOINT="http://10.244.1.11:80"
