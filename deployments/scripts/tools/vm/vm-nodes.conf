# ============================================================
# 虚拟机创建配置(vm-nodes.conf) — 独立于 cluster.conf
# ------------------------------------------------------------
# 定位: 本文件集中【虚拟机创建 + 虚拟机网络】相关配置, 与 cluster.conf 解耦。
#   · cluster.conf 只保留"集群部署"配置(NODES 5字段 / NTP / registry / operator 等);
#   · 需要**创建虚拟机**的节点在本文件 VM_NODES(10字段)定义;
#   · 虚拟机创建/网络变量(BASE_IMG/VM_DISK_DIR/VM_SSH_USERS/VM_SUBNET/BRIDGE/
#     NET_MODE/NAT_*/PHYS_WORKER_NET)在本文件顶部定义。
# ------------------------------------------------------------
# 变量区(虚拟机创建 + 虚拟网络; 被 tools/vm/*.sh 与 tools/net/*.sh 引用):
#   ① 虚拟机镜像/磁盘
BASE_IMG="${BASE_IMG:-${REPO_ROOT}/deployments/offline-files/virtual-machine/cloud-images/ubuntu2204-k8s-base.qcow2}"
VM_DISK_DIR="${VM_DISK_DIR:-/k8s/vm-disks}"
VM_SSH_USERS="${VM_SSH_USERS:-root ubuntu}"   # VM 内 SSH 用户名(基础镜像预埋, 空格分隔)
#   ①b 附加裸盘(默认每台 VM 附加 3×200GB 裸盘, 供 Ceph OSD 等测试/生产使用)
#       裸盘 = 无分区/无文件系统的空盘(Guest 内为 /dev/vdb~vdX, 由 Ceph/Rook 认领);
#       系统盘之外的附加块设备, 创建后不再格式化。
VM_DATA_DISKS="${VM_DATA_DISKS:-3}"               # 附加裸盘数量(0=不附加)
VM_DATA_DISK_SIZE="${VM_DATA_DISK_SIZE:-200}"     # 每块裸盘容量(GB)
VM_DATA_DISK_FORMAT="${VM_DATA_DISK_FORMAT:-qcow2}"   # qcow2(稀疏) | raw
#   ② 虚拟网络(桥接/NAT)
NET_MODE="${NET_MODE:-bridge}"          # bridge=方案A(privbr0+精准SNAT) | nat=方案B(libvirt NAT)
#   [方案A bridge]
BRIDGE="${BRIDGE:-privbr0}"
BRIDGE_IP="${BRIDGE_IP:-10.244.0.1}"
VM_SUBNET="${VM_SUBNET:-10.244.0.0/16}"
PHYS_WORKER_NET="${PHYS_WORKER_NET:-10.66.1.0/24}"
#   [方案B nat]
NAT_NET_NAME="${NAT_NET_NAME:-cubestack-nat}"
NAT_SUBNET="${NAT_SUBNET:-10.245.0.0/16}"
NAT_GATEWAY="${NAT_GATEWAY:-10.245.0.1}"

# ------------------------------------------------------------
# VM_NODES(10字段, 需创建虚拟机的节点):
#   格式(与旧 cluster.conf NODES 一致): role,hostname,ip,mac,mem_g,cpu,disk_g,ssh_user,ssh_password,node_type
#   role:     master | worker
#   mac:      显式 MAC 或 "-"(自动按主机名确定性生成, 幂等)
#   mem_g/cpu/disk_g: 虚拟机规格(内存G/核数/磁盘G)
#   ssh_user: VM 内 SSH 用户名(基础镜像预埋)
#   ssh_password: "-" = 用默认密码 SSH_DEFAULT_PASSWORD; 显式密码 = 该 VM 用此密码
#   node_type: vm(本文件内统一为 vm)
# 使用: tools/vm/create-vms.sh(或模块 vm_create)读取本文件逐台创建/启动虚拟机,
#       创建成功后**自动把 5 字段信息注入 cluster.conf 的 NODES**(幂等), 之后集群部署
#       只从 cluster.conf 读节点; 本文件仅虚拟机创建/启动使用。
# 新增虚拟机: 在本文件加一行 → sudo ./deployments/scripts/tools/vm/create-vms.sh
# ============================================================
VM_NODES=(
  "master,cubestack-k8s-master01,10.244.1.11,52:54:00:00:00:01,8,4,100,ubuntu,-,vm"
  "master,cubestack-k8s-master02,10.244.1.12,52:54:00:00:00:02,8,4,100,ubuntu,-,vm"
  "master,cubestack-k8s-master03,10.244.1.13,52:54:00:00:00:03,8,4,100,ubuntu,-,vm"
  "worker,cubestack-k8s-worker01,10.244.1.21,52:54:00:00:00:21,8,4,150,ubuntu,-,vm"
  "worker,cubestack-k8s-worker02,10.244.1.22,52:54:00:00:00:22,8,4,150,ubuntu,-,vm"
)
