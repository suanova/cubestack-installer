# ============================================================
# 虚拟机创建配置(vm-nodes.conf) — 独立于 cluster.conf
# ------------------------------------------------------------
# 定位: cluster.conf 的 NODES(5字段: role,hostname,ip,ssh_user,ssh_password)
#       不区分虚拟机/裸金属; 需要**创建虚拟机**的节点统一在本文件定义(10字段)。
# 格式(10字段, 与旧 cluster.conf NODES 一致): role,hostname,ip,mac,mem_g,cpu,disk_g,ssh_user,ssh_password,node_type
#   role:     master | worker
#   mac:      显式 MAC 或 "-"(自动按主机名确定性生成, 幂等)
#   mem_g/cpu/disk_g: 虚拟机规格(内存G/核数/磁盘G)
#   ssh_user: VM 内 SSH 用户名(基础镜像预埋)
#   ssh_password: "-" = 用默认密码 SSH_DEFAULT_PASSWORD; 显式密码 = 该 VM 用此密码
#   node_type: vm(本文件内统一为 vm)
# 使用: tools/vm/create-vms.sh(或模块 vm_create)读取本文件逐台创建/启动虚拟机,
#       创建成功后**自动把 5 字段信息注入 cluster.conf 的 NODES**(幂等), 之后集群部署
#       只从 cluster.conf 读节点; 本文件仅虚拟机创建/启动使用。
# 新增虚拟机: 在本文件加一行 → sudo ./deployments/scripts/tools/vm/create-vms.sh
# ============================================================
NODES=(
  "master,cubestack-k8s-master01,10.244.1.11,52:54:00:00:00:01,8,4,100,ubuntu,-,vm"
  "master,cubestack-k8s-master02,10.244.1.12,52:54:00:00:00:02,8,4,100,ubuntu,-,vm"
  "master,cubestack-k8s-master03,10.244.1.13,52:54:00:00:00:03,8,4,100,ubuntu,-,vm"
  "worker,cubestack-k8s-worker01,10.244.1.21,52:54:00:00:00:21,8,4,150,ubuntu,-,vm"
  "worker,cubestack-k8s-worker02,10.244.1.22,52:54:00:00:00:22,8,4,150,ubuntu,-,vm"
)
